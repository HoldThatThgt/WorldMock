:root[data-theme=&quot;light&quot;] {

}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);

}

.table-responsive {

  overflow-x: auto;

}

.table {

  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

}

.viz-stat {

.viz-stat-value {

.viz-row {

  align-items: center;
  gap: 10px;
}

  border: 0;
  background: var(--border);
}

.nav {

  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {

.progress-bar {

  border: 0;

}

.viz-badge {

}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

  corner-shape: var(--corner-shape);

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

.nav-pills .nav-link {
  min-width: 0;

  color: var(--muted-foreground);
  background: transparent;

.nav-pills .nav-link.active {

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;wm-seven-prompt&#x27;);
  const get = id =&gt; root.querySelector(&#x27;#&#x27; + id);
  const layers = [
    { id: &#x27;system&#x27;, name: &#x27;系统层&#x27;, title: &#x27;系统层（身份与行为准则）&#x27;,
      brief: &#x27;正式、简洁的世界交互说明&#x27;,
      content: &#x27;人物执行职责、交互协议、事实与自述的区别。&#x27;, update: &#x27;固定复用。&#x27;,
      dedup: &#x27;具体姓名只在人设层；工具专有约束只在工具层。&#x27; },
    { id: &#x27;tools&#x27;, name: &#x27;工具层&#x27;, title: &#x27;工具层（工具定义与可选目标）&#x27;,
      brief: &#x27;接口、目标、动作与条件完整配对&#x27;,
      content: &#x27;工具定义与全部可选目标说明；路线、库存、价格及操作条件也在这里。&#x27;,
      update: &#x27;随当前可用接口与目标替换；旧目录退出。&#x27;,
      dedup: &#x27;目标目录和工具说明只在工具层完整出现一次。&#x27; },
    { id: &#x27;persona&#x27;, name: &#x27;人设层&#x27;, title: &#x27;人设层（人物卡片）&#x27;,
      brief: &#x27;基础信息、性格、习惯、关系与偏好&#x27;,
      content: &#x27;基础身份、背景、性格、习惯、关系与偏好。&#x27;, update: &#x27;关系与偏好在原位置更新。&#x27;,
      dedup: &#x27;当日处境与活动进展归记忆层或进度层。&#x27; },
    { id: &#x27;memory&#x27;, name: &#x27;记忆层&#x27;, title: &#x27;记忆层&#x27;,
      brief: &#x27;昨天及更早 ＋ 当日更早&#x27;,
      content: &#x27;两组可读摘要，保留之前做过什么和仍需要知道的结果。&#x27;,
      update: &#x27;session 结束时整理已有 summary，加入记忆；跨日后调整时间归属。&#x27;,
      dedup: &#x27;只保存时间和摘要，不建立逐 session 的档案。&#x27; },
    { id: &#x27;todo&#x27;, name: &#x27;待办层&#x27;, title: &#x27;待办层&#x27;,
      brief: &#x27;旧到新的暂停 activity ＋ 今日 day_plan&#x27;,
      content: &#x27;暂停活动的续做条件与尚余事项；今日目标及当前状态。&#x27;,
      update: &#x27;按实际暂停时间从老到新，同刻按事件顺序；恢复或结束后移出暂停部分。&#x27;,
      dedup: &#x27;这里只显示还需做什么；过去发生的详细过程归记忆层或进度层。&#x27; },
    { id: &#x27;environment&#x27;, name: &#x27;环境层&#x27;, title: &#x27;环境层（此刻场景）&#x27;,
      brief: &#x27;身体状况 ＋ 所在环境静态信息&#x27;,
      content: &#x27;当前身体状况、所在地点或路程、场所性质与固定规则。&#x27;,
      update: &#x27;按当前观察替换；observed_at 记录观察时刻。&#x27;,
      dedup: &#x27;不罗列可达地点、商品、消息、活动进度或待办。&#x27; },
    { id: &#x27;progress&#x27;, name: &#x27;进度层&#x27;, title: &#x27;进度层&#x27;,
      brief: &#x27;当前 session 的有序决策与真实结果&#x27;,
      content: &#x27;模型决策与工具调用、工具结果，以及新消息、配送送达和提醒。&#x27;,
      update: &#x27;本 session 内按发生顺序追加；session 结束时整理入记忆。&#x27;,
      dedup: &#x27;同一事件只出现一次；进度层不含 thinking，不把旧消息每轮重述。&#x27; }
  ];
  const state = { view: &#x27;layers&#x27;, layer: &#x27;system&#x27;, step: &#x27;working&#x27;, format: &#x27;example&#x27; };
  const payload = JSON.parse(document.getElementById(&#x27;seven-json-data&#x27;).textContent);
  const steps = payload.steps;

  function renderLayers() {
    if (!get(&#x27;seven-stack&#x27;).children.length) for (const layer of layers) {
      const row = document.createElement(&#x27;div&#x27;); row.className = &#x27;seven-layer&#x27;;
      const button = document.createElement(&#x27;button&#x27;); button.className = &#x27;btn&#x27;; button.type = &#x27;button&#x27;;
      button.textContent = layer.name; button.dataset.layer = layer.id;
      button.addEventListener(&#x27;click&#x27;, () =&gt; { state.layer = layer.id; render(); save(); });
      const label = document.createElement(&#x27;div&#x27;); label.className = &#x27;seven-copy&#x27;; label.textContent = layer.brief;
      row.append(button, label); get(&#x27;seven-stack&#x27;).append(row);
    }
    root.querySelectorAll(&#x27;#seven-stack button&#x27;).forEach(button =&gt; {
      button.setAttribute(&#x27;aria-pressed&#x27;, String(state.layer === button.dataset.layer));
    });
    const selected = layers.find(layer =&gt; layer.id === state.layer);
    get(&#x27;seven-detail-title&#x27;).textContent = selected.title;
    get(&#x27;seven-detail-content&#x27;).textContent = selected.content;
    get(&#x27;seven-detail-update&#x27;).textContent = selected.update;
    get(&#x27;seven-detail-dedup&#x27;).textContent = selected.dedup;
    get(&#x27;seven-format&#x27;).value = state.format;
    const data = state.format === &#x27;schema&#x27; ? payload.schemas[selected.id] : payload.examples[selected.id];
    get(&#x27;seven-template&#x27;).textContent = JSON.stringify(data, null, 2);
  }

  function renderSession() {
    const step = steps[state.step];
    for (const option of get(&#x27;seven-step&#x27;).options) option.textContent = steps[option.value].label;
    get(&#x27;seven-step&#x27;).value = state.step;
    get(&#x27;seven-transition&#x27;).textContent = step.note;
    get(&#x27;seven-memory&#x27;).textContent = JSON.stringify(step.memory, null, 2);
    get(&#x27;seven-todo&#x27;).textContent = JSON.stringify(step.todo, null, 2);
    get(&#x27;seven-progress-json&#x27;).textContent = JSON.stringify(step.progress, null, 2);
    get(&#x27;seven-memory-count&#x27;).textContent = &#x27;昨天及更早 / 当日更早&#x27;;
    get(&#x27;seven-memory-summaries&#x27;).replaceChildren();
    for (const entry of [...step.memory.earlier_days, ...step.memory.earlier_today]) {
      const item = document.createElement(&#x27;li&#x27;);
      item.textContent = (entry.date || entry.recorded_at.slice(11, 16)) + &#x27; · &#x27; + entry.summary;
      get(&#x27;seven-memory-summaries&#x27;).append(item);
    }
    const names = step.todo.paused_activities.map(item =&gt; item.name);
    get(&#x27;seven-todo-count&#x27;).textContent = (names.length ? &#x27;暂停：&#x27; + names.join(&#x27;、&#x27;) : &#x27;暂无暂停 activity&#x27;)
      + &#x27;；今日 day_plan 保留&#x27;;
    get(&#x27;seven-session-name&#x27;).textContent = step.sessionName + &#x27; · &#x27;
      + step.progress.session_started_at.slice(11, 19) + &#x27; 起&#x27;;
    root.querySelectorAll(&#x27;[data-session]&#x27;).forEach(node =&gt; {
      node.dataset.active = String(node.dataset.session === step.place);
    });
    get(&#x27;seven-records&#x27;).replaceChildren();
    if (!step.progress.events.length) {
      const empty = document.createElement(&#x27;li&#x27;); empty.className = &#x27;seven-empty&#x27;;
      empty.textContent = &#x27;当前 session 尚无新决策或事件。&#x27;;
      get(&#x27;seven-records&#x27;).append(empty);
    }
    for (const event of step.progress.events) {
      const labels = { decision: &#x27;决策&#x27;, tool_call: &#x27;工具调用&#x27;, registration: &#x27;登记确认&#x27;,
        tool_result: &#x27;工具结果&#x27;, message_arrival: &#x27;新消息&#x27;, delivery: &#x27;配送送达&#x27;, deadline: &#x27;截止提醒&#x27; };
      const content = event.type === &#x27;tool_call&#x27; ? event.tool_name + &#x27; &#x27; + JSON.stringify(event.arguments)
        : event.type === &#x27;tool_result&#x27; ? JSON.stringify(event.result) : event.decision || event.message;
      appendRecord(event.occurred_at, labels[event.type], content);
    }
  }

  function appendRecord(time, type, content) {
      const row = document.createElement(&#x27;li&#x27;);
      const clock = document.createElement(&#x27;time&#x27;); clock.textContent = time.slice(11, 19);
      const body = document.createElement(&#x27;div&#x27;);
      const kind = document.createElement(&#x27;strong&#x27;); kind.textContent = type + &#x27;｜&#x27;;
      body.append(kind, document.createTextNode(content)); row.append(clock, body);
      get(&#x27;seven-records&#x27;).append(row);
  }

  function render() {
    get(&#x27;seven-view&#x27;).value = state.view;
    for (const view of [&#x27;layers&#x27;, &#x27;session&#x27;, &#x27;removal&#x27;]) get(&#x27;seven-&#x27; + view + &#x27;-panel&#x27;).hidden = state.view !== view;
    renderLayers(); renderSession();
  }

  function restore(saved) {
    const data = saved?.modelContent;
    if (data?.design !== &#x27;seven-layers&#x27;) return;
    if ([&#x27;layers&#x27;, &#x27;session&#x27;, &#x27;removal&#x27;].includes(data.view)) state.view = data.view;
    if (layers.some(layer =&gt; layer.id === data.layer)) state.layer = data.layer;
    if (Object.hasOwn(steps, data.step)) state.step = data.step;
    if ([&#x27;example&#x27;, &#x27;schema&#x27;].includes(data.format)) state.format = data.format;
  }

  function save() {
    window.openai?.setWidgetState({ modelContent: { design: &#x27;seven-layers&#x27;, ...state }, privateContent: null })
      .catch(() =&gt; {});
  }
  get(&#x27;seven-format&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; { state.format = event.target.value; render(); save(); });
  get(&#x27;seven-view&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; { state.view = event.target.value; render(); save(); });
  get(&#x27;seven-step&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; { state.step = event.target.value; render(); save(); });
  window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
    restore(event.detail.globals.widgetState); render();
  });
  restore(window.openai?.widgetState); render();
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
