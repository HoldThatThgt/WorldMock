schema_version = 1

[run]
input = "./data/action.jsonl"
output = "./out/action.jsonl"
modality = "text"
mode = "process"
batch_size = 16
seed = 20260915

[input]
text_field = "input"

[dedup]
enabled = false

[classify]
enabled = false

[quality]
enabled = false

[generate]
enabled = false

[annotate]
enabled = true
llm = "default"
instruction = """
根据动作发生前的可见历史，归纳此时的需求与不确定性。不能知道尚未发生的下一动作，不猜测隐藏结果。代码负责真实下一动作和参数。
仅输出 target 中的 claims、intent_candidates 和 uncertainty。
input.observation_value_encoding 声明字段字典版本和解码后摘要，input.observation_value_dictionary 始终存在。
若 observation 的 data 直接字段值是仅含 value_pointer 的对象，按 RFC 6901 从当前 input 单跳取得完整字段值；该完整值属于原事件证据。
证据仅限 input.events 与 input.prerequisite_state 中、且列于 input.allowed_evidence_event_ids 的可见事件。
claims 的 kind 必须区分事实 fact、推断 inference、假设 hypothesis。
事实中的每个独立断言都须由该 claim 所列来源直接支持，包括正文中的数量、时间关系与因果描述；不能借用未列出的 input.events 补证。
推断必须有可追溯依据并明确区别于已证实结果，不能仅改为 inference 或 hypothesis 就保留无依据断言；来源明确给出的类别、持续性或因果关系可标为 fact。
事实和推断的每个 evidence_event_ids 值必须逐字取自 input.allowed_evidence_event_ids，禁止引用字典指针、摘要或其他标识。
身份字段是不透明标识；除非 input 明确说明组成语义，不得从数字或片段推导步骤、时间或结果。
命名布尔字段的 false 只否定该字段表达的命题，不能推出未提供的上位类别或其反面。
位置断言只写在 observation 事件支持的 claim 内，不从动作结果推断动作的执行地点；动作结果事件没有位置字段，与 observation 的时间邻近不构成位置证据。
不写跨事件元断言：claim 只陈述事件中的内容、行为与因果，不把“某事件与当前状态共同构成可见历史”一类关于证据集合自身的命题写成 claim。
认识论上的“无法确定”归入 uncertainty，不能仅增加“推测”或 hypothesis 标签保留无依据的身份解读。
同一认识论内容不得同时在 claim 与 uncertainty 双重安置；uncertainty 中已有的无法确定事项不再另立 claim，claim 已陈述的内容不再重复写入 uncertainty。
可见证据不能支持具体意图时，intent=unknown、basis=uncertain 是合法组合。
没有历史进度不能由当前目录推出“从未开始”；没有可见阈值不能自行把数值分成高低，也不能在评审时要求这种分类。
精确单位换算和数值近似可以保留；数值接近零本身不等同于高低或需求等级分类。
简洁说明实际内容、行为与因果；摘要用共同阶段或同一活动的概括保留重复发生及有意义的差异，不逐次建立同文 claim；完整逐次事件由工程保存；每项只引用直接支持正文所必需的实际事件，不为完整保存原始材料穷举 ID；不以常识补写遗漏的经历。
先按活动阶段或因果主题合并证据，一条 claim 可以引用多个事件。
聚合用于消除同一主题的重复，不要求合并不同因果主题；有意义的阶段变化或因果差异应保留。
按主体分组是明示合格的聚合形态：动作结果、人物终态、可用任务、消息、出行选项、可选内容与娱乐、日历各自成一条 claim，条内保留该主体的名称与数值；该形态不因涵盖条目多或信息集中而构成缺陷，也不属于逐目录项复述。
三十二条是上限而非目标数量。评审因聚合不足判失败时，必须指出共享主体、关系与尚未概括的重复内容，不能只因条目数量或多个条目来自同一 observation 判失败；因复述判失败时，必须指明具体哪几条 claim 共享同一主体且内容重复，不得以“复述目录”一类笼统说法定缺陷。
禁止逐事件、逐目录项、逐终态字段或逐条未变化的起止状态复述；输出前合并到最多 32 条 claims。
input 原事件由工程完整保存；target 是最多 32 条的聚合摘要，不要求逐事实复述。
claims 最多 32 条；每条 text 最多 512 字符；每条 evidence_event_ids 最多 64 个，单个标识最多 64 字符。
intent_candidates 最多 8 个且不得重复；uncertainty 最多 1024 字符。
"""

[verify]
enabled = true
llm = "judge"
policy = "repair"
max_repair_rounds = 3
extra_criteria = """
每轮独立完整审查当前候选，一次列出发现的全部实质问题，不能发现一项后推定其他项合格。
固定清单包括主题聚合、逐条引用支持、fact/inference/hypothesis 分类及 intent/uncertainty 一致性。
评审只看当前完整可见 input、当前 target 和任务指令；历史通过、失败或评审措辞不能代替本轮判断。
意见对应的要求在任务指令中无明示依据，或任务指令存在两种均成立的读法时，该意见不得作为 fail 的依据。
语义候选只有 target；task、input、provenance 和未来真实目标均在评审通过后由代码组装，不能假设知道下一动作。
仅按 Schema 返回 verdict=pass 或 fail，不能返回 unknown。输出必须是单个 JSON 对象，禁止先输出自然语言意见或 Markdown。
顶层必需且仅允许 critiques 和 verdict；critiques 为数组，每项必需且仅允许 aspect 和 opinion 两个字符串，
不能使用 issue。verdict 必须依据证据取 pass 或 fail，不使用 unknown。
"""

[trace]
enabled = true
channels = ["llm", "verify", "schema"]
content = "full"

[output]
schema_path = "schemas/semantic-target.json"
validator = "hooks.py:validate_annotation"
max_repair_attempts = 4
meta_mode = "inline"
rejects = "refs"
