schema_version = 1

[run]
output = "./out/rules.jsonl"
modality = "text"
mode = "generate_only"
batch_size = 8
seed = 20260915

[dedup]
enabled = true

[classify]
enabled = false

[frame.classify]
enabled = false

[quality]
enabled = false

[annotate]
enabled = true
llm = "default"
instruction = "概括实际请求与登记结果，忠实保留缺失、乱序和超时，不把异常补成成功。"

[verify]
enabled = false

[generate]
enabled = true
form = "sequence"
mode = "declared"
semantic_llm = "default"
evaluation_llm = "judge"
max_slot_attempts = 3
state_validator = "rule-hooks.py:validate_state"

[output]
schema_path = "rule-schemas/annotation.json"
meta_mode = "inline"
rejects = "none"

[class.action_completion]
description = "人物请求、环境受理、环境确认结果的生活请求登记交互"

[class.action_completion.generate]
instruction = "围绕 origin.description 中真实动作提出登记请求。本序列只模拟该请求的登记和登记回执，completed 表示登记完成，不表示睡眠、旅行或工作本身已经完成。六十秒限制只作用于回执。新交互属于生成分支，不把它称为原始已发生经历。"
state_schema_path = "rule-schemas/state.json"
initial_state_source = "catalog"
initial_state_catalog_path = "data/rules-catalog.jsonl"

[frame.class.request]
description = "人物提出生活请求登记"
[frame.class.request.generate]
instruction = "根据 origin.description 自然提出请求，带上 request.id，不声称已经受理或完成。"
schema_path = "rule-schemas/frame.json"

[frame.class.accept]
description = "环境确认已经收到生活请求登记"
[frame.class.accept.generate]
instruction = "acknowledged 状态说明收到请求并正在处理；blocked 状态仅说明迟到的收件回执，不能称请求已重新处理或完成。带上 request.id。"
schema_path = "rule-schemas/frame.json"

[frame.class.complete]
description = "环境确认登记结果"
[frame.class.complete.generate]
instruction = "completed 表示请求登记完成，blocked 表示尚未受理不能登记，expired 表示登记回执超时；绝不能说实际生活活动已经完成。只表达实际状态，带上 request.id；不输出内部状态英文词。"
schema_path = "rule-schemas/frame.json"

[generate.pattern.action_completion]
sequence_class = "action_completion"
description = "请求被受理后，必须在六十秒内确认登记完成；与原生活活动持续多久无关。"
order = ["request", "accept", "complete"]
max_span_s = 360

[[generate.pattern.action_completion.roles]]
name = "request"
frame_class = "request"
actor = "person"
read_roots = ["/request", "/origin"]
write_roots = ["/request/status"]
publish_roots = ["/request/id", "/request/status"]
observers = ["person", "environment"]
state_instruction = "先 test /request/status 为 new，再 replace 为 pending；不修改任何其他字段。"
pre_state_schema_path = "rule-schemas/pre-request.json"
payload_bindings = [
  { payload_path = "/request_id", state_phase = "after", state_path = "/request/id" },
  { payload_path = "/status", state_phase = "after", state_path = "/request/status" }
]

[[generate.pattern.action_completion.roles]]
name = "accept"
frame_class = "accept"
actor = "environment"
read_roots = ["/request", "/origin"]
write_roots = ["/request/accepted", "/request/status"]
publish_roots = ["/request/id", "/request/status", "/request/accepted"]
observers = ["person", "environment"]
state_instruction = "先 test 当前 /request/status。若 pending，replace /request/accepted 为 true、status 为 acknowledged；若 blocked，只将 accepted 改 true，保持 blocked，不重新处理。"
pre_state_schema_path = "rule-schemas/pre-accept.json"
payload_bindings = [
  { payload_path = "/request_id", state_phase = "after", state_path = "/request/id" },
  { payload_path = "/status", state_phase = "after", state_path = "/request/status" }
]

[[generate.pattern.action_completion.roles]]
name = "complete"
frame_class = "complete"
actor = "environment"
read_roots = ["/request", "/origin", "/sla"]
write_roots = ["/request/status"]
publish_roots = ["/request/id", "/request/status"]
observers = ["person", "environment"]
state_instruction = "先 test /request/accepted。若 false，将 /request/status replace 为 blocked；若 true 且 wait_since_previous_us <= /sla/max_wait_us，改为 completed；超过则改为 expired。"
pre_state_schema_path = "rule-schemas/pre-complete.json"
payload_bindings = [
  { payload_path = "/request_id", state_phase = "after", state_path = "/request/id" },
  { payload_path = "/status", state_phase = "after", state_path = "/request/status" }
]

[[generate.pattern.action_completion.gaps]]
name = "request_to_accept"
before = "request"
after = "accept"
min_gap_s = 1
max_gap_s = 30

[[generate.pattern.action_completion.gaps]]
name = "accept_to_complete"
before = "accept"
after = "complete"
min_gap_s = 1
max_gap_s = 60

[[generate.counterfactual_sets]]
name = "life_action_training"
pattern = "action_completion"
count = 1

[[generate.counterfactual_sets.variants]]
name = "positive"
kind = "positive"
outcome_schema_path = "rule-schemas/outcome-positive.json"

[[generate.counterfactual_sets.variants]]
name = "missing_accept"
kind = "missing"
target_role = "accept"
outcome_schema_path = "rule-schemas/outcome-missing.json"

[[generate.counterfactual_sets.variants]]
name = "complete_before_accept"
kind = "reordered"
target_before = "accept"
target_after = "complete"
outcome_schema_path = "rule-schemas/outcome-reordered.json"

[[generate.counterfactual_sets.variants]]
name = "completion_timeout"
kind = "interval_exceeded"
target_gap = "accept_to_complete"
min_excess_s = 1
max_excess_s = 60
outcome_schema_path = "rule-schemas/outcome-timeout.json"

[generate.timeline]
timestamp_start = "2026-01-05T09:00:00+08:00"
event_gap_s = [1, 5]
session_max_events = 8
session_max_span_s = 600
session_gap_s = 600
noise_events = 0
duplicate_sequences = 0

[trace]
enabled = true
channels = ["llm", "schema", "verify"]
content = "full"
