schema_version = 1

[run]
input = "./data/dreaming.jsonl"
output = "./out/dreaming.jsonl"
modality = "text"
mode = "process"
batch_size = 16
seed = 20260915

[input]
text_field = "input"

[dedup]
enabled = false

[classify]
enabled = false

[quality]
enabled = false

[generate]
enabled = false

[annotate]
enabled = true
llm = "default"
instruction = """
按 input.mode 生成经历归纳 induction、反思 reflection 或反事实 counterfactual。归纳和反思引用真实证据；反事实必须明确 hypothesis，想象结果不标为已经重演或事实。
input.counterfactual.world_kind=observed 时，input.events 只属于原世界；先归纳原世界事实，再提出未执行的明确假设及可能结果，绝不能把原事件称为重演。
仅当 input.counterfactual.world_kind=resimulated 时，input.events 是实际重演分支的已发生结果，可引用为分支内事实；明确假设条件与分支身份，禁止称为原世界已经发生的经历。
仅输出 target 中的 claims、intent_candidates 和 uncertainty。
claims 的 kind 必须区分事实 fact、推断 inference、假设 hypothesis。
事实和推断的每个 evidence_event_ids 值必须逐字取自 input.allowed_evidence_event_ids，禁止引用其他标识。
简洁说明实际内容、行为与因果；摘要用共同阶段或同一活动的概括保留重复发生及有意义的差异，不逐次建立同文 claim；完整逐次事件由工程保存；每项只引用直接支持正文所必需的实际事件，不为完整保存原始材料穷举 ID；不以常识补写遗漏的经历。
先按活动阶段或因果主题合并证据，一条 claim 可以引用多个事件。
禁止逐事件、逐目录项、逐终态字段或逐条未变化的起止状态复述；输出前合并到最多 32 条 claims。
input 原事件由工程完整保存；target 是最多 32 条的聚合摘要，不要求逐事实复述。
claims 最多 32 条；每条 text 最多 512 字符；每条 evidence_event_ids 最多 64 个，单个标识最多 64 字符。
intent_candidates 最多 8 个且不得重复；uncertainty 最多 1024 字符。
"""

[verify]
enabled = true
llm = "judge"
policy = "repair"
max_repair_rounds = 2
extra_criteria = """
评审只依据 input.events 与 input.prerequisite_state 中、且列于 input.allowed_evidence_event_ids 的证据，
评价 target.claims、intent_candidates、uncertainty。事实和推断须有实际来源，hypothesis不能当成已经发生。
语义候选只有 target；task、input、provenance 和未来真实目标均在评审通过后由代码组装，不能假设知道下一动作。
逐条审查 target.claims。每条 claim 的 evidence_event_ids 所列事件必须独立支持该 claim 正文中的全部事实、数量、时间关系与因果描述；不能借用该 claim 未列出的其他 input.events 补全证据。
正文能从完整 input 推知但所列引用不足时仍判 fail，并明确要求修正引用或收窄结论。
每轮独立完整审查当前候选，一次列出发现的全部实质问题，不能发现一项后推定其他项合格。
固定清单包括主题聚合、逐条引用对全部事实/数量/时间/因果的支持、kind 分类及 intent/uncertainty 一致性。
身份字段是不透明标识；input 未明确说明组成语义时，不得从数字或片段推导步骤、时间或结果。
“无法确定”属于 uncertainty，不能仅改成 hypothesis；当前目录不能证明历史上从未开始。
没有可见阈值时不得把数值分为高低，也不得要求候选作这种分类。
仅按 Schema 返回 verdict=pass 或 fail，不能返回 unknown。输出必须是单个 JSON 对象，禁止先输出自然语言意见或 Markdown。
顶层必需且仅允许 critiques 和 verdict；critiques 为数组，每项必需且仅允许 aspect 和 opinion 两个字符串，
不能使用 issue。verdict 必须依据证据取 pass 或 fail，不使用 unknown。
"""

[trace]
enabled = true
channels = ["llm", "verify", "schema"]
content = "full"

[output]
schema_path = "schemas/semantic-target.json"
validator = "hooks.py:validate_annotation"
meta_mode = "inline"
rejects = "refs"
