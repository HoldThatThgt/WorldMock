const RS = { loaded:false, items:[], filtered:[], rendered:0, kw:'' };
const RS_PATH = `json_extract(e.body,'$.data.response.choices[0].message.provider_specific_fields.reasoning_content')`;
function rsQuery(kw){
  let sqlText = `SELECT v.event_seq AS seq, v.agent AS agent,
    json_extract(e.body,'$.occurred_at') AS t, ${RS_PATH} AS rc
    FROM ${EVENTS_OF_TYPE} AND ${RS_PATH} IS NOT NULL`;
  const params=['model_response'];
  if (kw){
    sqlText += ` AND ${RS_PATH} LIKE ? ESCAPE '\\'`;
    params.push('%'+kw.replace(/[\\%_]/g,m=>'\\'+m)+'%');
  }
  return q(sqlText+' ORDER BY v.event_seq', params);
}
function renderReasoning(){
  const el = $('#rs-body');
  if (!RS.loaded){ RS.loaded = true; RS.items = rsQuery(''); }
  el.innerHTML = `
  <div class="filter-bar">
    <label>关键词 <input type="search" id="rs-kw" placeholder="搜索 reasoning_content（SQL LIKE，支持中文）" value="${esc(RS.kw)}" style="width:280px"></label>
    <span style="flex:1"></span>
    <span id="rs-count" style="color:var(--fg-dim);font-size:12px"></span>
  </div>
  <div class="card" style="padding:0">
    <div id="rs-list"></div>
    <div class="tl-sentinel" id="rs-sentinel">下拉加载更多 …</div>
  </div>`;
  let timer=null;
  $('#rs-kw').oninput = ev=>{ clearTimeout(timer); timer=setTimeout(()=>{
    RS.kw = ev.target.value.trim();
    RS.items = rsQuery(RS.kw);
    refreshRs();
  },300); };
  if (RS.io) RS.io.disconnect();
  RS.io = new IntersectionObserver(es=>{ if(es[0].isIntersecting) renderMoreRs(); },
    {root:$('#main'), rootMargin:'400px'});
  RS.io.observe($('#rs-sentinel'));
  refreshRs();
}
function refreshRs(){
  const agent = agentFilterVal();
  RS.filtered = RS.items.filter(x=>(!agent || String(x.agent)===agent) && inDay(x.t));
  RS.rendered = 0;
  RS.lastDay = null;
  $('#rs-list').innerHTML='';
  $('#rs-count').textContent = `${RS.filtered.length} 条思考记录`;
  renderMoreRs();
}
function renderMoreRs(){
  if (RS.rendered >= RS.filtered.length){
    $('#rs-sentinel').textContent = RS.filtered.length? '—— 到底了 ——':'（无匹配）';
    return;
  }
  const end = Math.min(RS.rendered+50, RS.filtered.length);
  const frag = document.createDocumentFragment();
  for (let i=RS.rendered;i<end;i++){
    const it = RS.filtered[i];
    const day = dayIndex(it.t);
    if (day!==RS.lastDay){
      const head = document.createElement('div');
      head.className = 'tl-day'; head.textContent = dayLabel(day);
      frag.appendChild(head); RS.lastDay = day;
    }
    const div = document.createElement('div');
    div.className='rs-item';
    div.innerHTML = `<div class="rs-head">
      <span class="t" title="${esc(fmtT(it.t))}">${fmtClock(it.t)}</span>
      <span class="a ${agentCls(it.agent)}">${it.agent==null?'系统':esc(agentName(it.agent))}</span>
      <span class="x">${esc((it.rc||'').slice(0,160).replace(/\s+/g,' '))}</span></div>
      <div class="rs-body"><pre>${esc(it.rc||'')}</pre></div>`;
    div.onclick = ()=>div.querySelector('.rs-body').classList.toggle('on');
    frag.appendChild(div);
  }
  RS.rendered = end;
  $('#rs-list').appendChild(frag);
}

/* ---------- SQL 控制台 ---------- */
function renderSqlConsole(){
  const el = $('#sql-body');
  if (el.dataset.inited) return;
  el.dataset.inited='1';
  el.innerHTML = `
  <div class="card">
    <p style="color:var(--fg-dim);margin-bottom:8px;line-height:1.8">只读查询（仅允许 SELECT / WITH / PRAGMA / EXPLAIN），最多返回 200 行。<br>
    表：<code>events(event_seq, event_id, body)</code> · <code>world_state(singleton, version, body)</code> · <code>artifacts(sha256, body)</code> · <code>checkpoints(checkpoint_id, body, record_sha256)</code>。body 为 JSON，可用 <code>json_extract</code> 取字段。<br>
    按事件类型筛选时连接临时表 <code>viewer_event(event_seq, type, agent)</code>，比逐行对 body 取 <code>$.event_type</code> 快得多。</p>
    <textarea id="sql-input" spellcheck="false">SELECT event_seq, json_extract(body,'$.event_type') AS type, json_extract(body,'$.occurred_at') AS t
FROM events ORDER BY event_seq DESC LIMIT 20</textarea>
    <button class="primary" id="sql-run">运行 (Ctrl+Enter)</button>
    <div id="sql-msg"></div>
    <div id="sql-out"></div>
  </div>`;
  const run = ()=>{
    const sqlText = $('#sql-input').value.trim().replace(/;+\s*$/,'');
    const msg = $('#sql-msg'), out = $('#sql-out');
    msg.className=''; msg.textContent='';
    if (!/^(select|with|pragma|explain)\b/i.test(sqlText)){
      msg.className='err'; msg.textContent='拒绝：仅允许 SELECT / WITH / PRAGMA / EXPLAIN 语句。'; return;
    }
    const finalSql = /^(pragma|explain)\b/i.test(sqlText)? sqlText : `SELECT * FROM (${sqlText}) LIMIT 200`;
    const tA = performance.now();
    try{
      const rows = q(finalSql);
      const cols = rows.length? Object.keys(rows[0]) : [];
      const ms = (performance.now()-tA).toFixed(1);
      out.innerHTML = rows.length
        ? `<table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
           ${rows.map(r=>`<tr>${cols.map(c=>`<td style="font-family:var(--mono);font-size:12px;max-width:480px;word-break:break-all">${esc(typeof r[c]==='string'? r[c].slice(0,300) : r[c])}</td>`).join('')}</tr>`).join('')}</table>`
        : '<div class="empty">（0 行）</div>';
      msg.textContent = `${rows.length}${rows.length===200?'（达到上限）':''} 行 · ${ms} ms`;
    }catch(e){ msg.className='err'; msg.textContent = 'SQL 错误：'+e.message; }
  };
  $('#sql-run').onclick = run;
  $('#sql-input').addEventListener('keydown', ev=>{
    if ((ev.ctrlKey||ev.metaKey) && ev.key==='Enter'){ ev.preventDefault(); run(); }
  });
}

/* ================================================================
 * 一天视图 —— 读取 render_day.py 产出的 timeline markdown
 * （文件拖入/选择或粘贴，纯前端解析，不依赖已加载的 sqlite）
 * ================================================================ */
function parseDayMarkdown(text){
  const rows = [];
  let title = '';
  for (const line of String(text||'').split(/\r?\n/)){
    const t = line.trim();
    if (!title && t.startsWith('# ')){ title = t.slice(2).trim(); continue; }
    if (!t.startsWith('|')) continue;
    const cells = t.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    if (cells.length < 4) continue;
    const m = cells[0].match(/^(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})$/);
    if (!m) continue;
    rows.push({start:m[1], end:m[2], label:cells[1], duration:cells[2], segments:cells[3]});
  }
  rows.sort((a,b)=> (a.start<b.start?-1:a.start>b.start?1:0) || (a.end<b.end?-1:a.end>b.end?1:0));
  return {title, rows};
}
function renderDay(){
  const el = $('#day-body');
  if (!S.day){
    el.innerHTML = `
      <div class="hint">读取 <code>scripts/render_day.py</code> 产出的 <code>timeline/&lt;agent&gt;-&lt;date&gt;.md</code>：
        把 markdown 文件拖入下面虚线框（或点击选择文件），也可以把内容粘贴到文本框后点"解析粘贴内容"。
        本视图纯前端解析，不依赖 sqlite，可与任何一份时间线投影单独使用。</div>
      <div id="day-drop" role="button" tabindex="0">
        <p><b>拖入 .md 文件</b>（或点击选择）</p>
        <input type="file" id="day-file" accept=".md,.markdown,.txt">
      </div>
      <textarea id="day-paste" rows="8" placeholder="或把 timeline markdown 粘贴到这里…" spellcheck="false"></textarea>
      <div style="margin:8px 0"><button id="day-load">解析粘贴内容</button> <span id="day-err" style="color:var(--err)"></span></div>`;
    bindDayInput();
    return;
  }
  const d = S.day;
  const rowsHtml = d.rows.map(r=>`<tr>
      <td style="white-space:nowrap;font-family:var(--mono)">${esc(r.start)}–${esc(r.end)}</td>
      <td>${esc(r.label)}</td>
      <td style="white-space:nowrap">${esc(r.duration)}</td>
      <td class="num">${esc(r.segments)}</td></tr>`).join('');
  el.innerHTML = `
    <div class="kv"><span class="k">来源</span><span class="v">${esc(d.source)}</span></div>
    <div class="kv"><span class="k">标题</span><span class="v">${esc(d.title || '—')}</span></div>
    <div class="kv"><span class="k">条目</span><span class="v">${nf(d.rows.length)} 行（按开始时间排序）</span></div>
    <button id="day-clear" style="margin:8px 0">清除，换一份</button>
    ${ d.rows.length
      ? `<table><tr><th>起止</th><th>活动</th><th>总时长</th><th class="num">段数</th></tr>${rowsHtml}</table>`
      : `<div class="empty">该日无活动记录</div>` }`;
  $('#day-clear').onclick = ()=>{ S.day = null; renderDay(); };
}
function loadDayText(text, source){
  const parsed = parseDayMarkdown(text);
  if (!parsed.rows.length && !parsed.title){
    const err = $('#day-err');
    if (err) err.textContent = '未解析到时间线行：需要 render_day.py 的 markdown（# 标题 + "| 起止 | 活动 | 总时长 | 段数 |" 表格）';
    return;
  }
  S.day = {title: parsed.title, rows: parsed.rows, source};
  renderDay();
}
function bindDayInput(){
  const drop = $('#day-drop'), input = $('#day-file');
  const readFile = f => f.text().then(t => loadDayText(t, f.name));
  drop.onclick = ()=>input.click();
  drop.onkeydown = ev=>{ if(ev.key==='Enter'||ev.key===' ') input.click(); };
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t, ev=>{
    ev.preventDefault(); drop.classList.add('dragover');
  }));
  drop.addEventListener('dragleave', ()=>drop.classList.remove('dragover'));
  drop.addEventListener('drop', ev=>{
    ev.preventDefault(); drop.classList.remove('dragover');
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (f) readFile(f);
  });
  input.onchange = ()=>{ if (input.files.length) readFile(input.files[0]); };
  $('#day-load').onclick = ()=>{
    const text = $('#day-paste').value;
    if (!text.trim()){ $('#day-err').textContent = '粘贴内容为空'; return; }
    loadDayText(text, '粘贴内容');
  };
}

/* ================================================================
 * 文件加载与入口
 * file-input 同时承担点击选择与自动化测试（set_input_files）入口。
 * ================================================================ */
/** @brief 把足迹库分块读进内存，日志末行随读随报进度。文件在读取途中被改动（运行仍在写这个库）时浏览器会拒绝
 *  继续读：记英文错误日志，向用户说明重试或先复制一份。 */
async function readDatabaseFile(file, logEl){
  const head = logEl.textContent, megabytes = bytes => (bytes/1048576).toFixed(1);
  const report = done => { logEl.textContent = `${head}· 读取 ${file.name}（${megabytes(done)} / ${megabytes(file.size)} MB）…\n`; };
  report(0);
  try{ return await ViewerEngine.readChunks(file, report); }
  catch(error){
    console.error('Reading the database file failed:', error);
    throw new Error(`读取 ${file.name} 失败（${error.message}）。运行仍在写入这个库时，读取途中文件变动会失败：` +
      '请重试，或先复制一份再拖入。');
  }
}
async function handleFiles(fileList, dirEntries){
  const logEl = $('#drop-log'); logEl.style.display='block'; logEl.textContent='';
  const log = m => { logEl.textContent += m+'\n'; logEl.scrollTop = logEl.scrollHeight; };
  const errEl = $('#drop-err'); errEl.style.display='none';
  try{
    log('· 加载 SQLite 引擎（CDN）…');
    if (!S.engine) S.engine = await ViewerEngine.load();
    log('· 引擎就绪');

    const files = Array.from(fileList||[]);
    let file = null;
    for (const f of files) if (/\.(sqlite3?|db)$/i.test(f.name)){ file = f; break; }
    if (!file && files.length===1) file = files[0];
    if (!file) throw new Error('未找到 .sqlite 文件 —— 请拖入 footprints.sqlite（可与 run 目录一起拖入）');
    S.fileName = file.name;
    const store = await readDatabaseFile(file, logEl);
    log('· 打开数据库并建立索引（大文件约需数秒）…');
    await new Promise(r=>setTimeout(r,30));
    S.db = ViewerEngine.open(S.engine, store);
    log('· 数据库已打开');

    buildIndex();

    log('· 读取随库提供的记忆文件与运行清单 …');
    await loadRunFiles(files, dirEntries||[]);
    log(`· 记忆文件：${Object.keys(S.memFiles).length} 个 agent · 运行清单：${S.runManifest?.path||'未读取'}`);

    $('#run-meta').textContent = `${S.runId.slice(0,8)} · ${fmtT(S.t0)} ~ ${fmtT(S.t1)} · ${nf(S.events.length)} 事件`;
    const sel = $('#agent-filter');
    sel.innerHTML = '<option value="">全部</option>' +
      S.agentIds.map(id=>`<option value="${id}">${esc(agentName(id))}</option>`).join('');
    /* 全局 Agent 筛选联动所有视图（SQL 控制台为原始数据视图，不联动） */
    sel.onchange = ()=>{ if (S.view!=='sql') switchView(S.view); };
    bindDayFilter();
    buildNav();
    $('#drop-zone').classList.add('hidden');
    $('#app').classList.add('on');
    switchView('overview');
  }catch(e){
    errEl.style.display='block';
    errEl.textContent = '加载失败：'+e.message;
    log('× 失败');
  }
}

/** @brief 全局日期筛选：列出运行覆盖的每个当地日（「全部」在前），改选时重绘当前视图；两侧按钮逐日前后移动，
 *  第一天再往前回到「全部」。 */
function bindDayFilter(){
  const sel = $('#day-filter');
  let options = '<option value="">全部</option>';
  for (let day=dayIndex(S.t0); day<=dayIndex(S.t1); day++)
    options += `<option value="${day}">${esc(dayLabel(day))}</option>`;
  sel.innerHTML = options;
  sel.onchange = ()=>selectDay(sel.value);
  const step = delta => ()=>{
    const next = sel.selectedIndex + delta;
    if (next<0 || next>=sel.options.length) return;
    selectDay(sel.options[next].value);
  };
  $('#day-prev').onclick = step(-1);
  $('#day-next').onclick = step(1);
}

/** @brief 读入与足迹库一起拖入或选择的运行文件：目录中的人物记忆文件；顶层与各层目录中的 manifest.json 作运行清单候选。 */
async function loadRunFiles(files, dirEntries){
  const manifests = Array.from(files).filter(file=>file.name==='manifest.json')
    .map(file=>({path:file.name, read:()=>file.text()}));
  if (dirEntries.length) await loadDirFiles(dirEntries, manifests);
  await loadRunManifest(manifests);
}

/* 目录拖入 → MEMORY.md / episodes.jsonl；各层的 manifest.json 记入 manifests（运行清单候选，见 loadRunManifest） */
async function loadDirFiles(entries, manifests){
  const walk = async (entry, path='')=>{
    if (entry.isFile){
      const file = ()=>new Promise((res,rej)=>entry.file(res,rej));
      if (entry.name==='manifest.json')
        manifests.push({path:(path+'/'+entry.name).slice(1), read:async ()=>(await file()).text()});
      if (entry.name==='MEMORY.md' || entry.name==='episodes.jsonl'){
        const m = (path+'/'+entry.name).match(/agent_?0*(\d+)/i);
        const aid = m? String(+m[1]) : String(Object.keys(S.memFiles).length+1);
        const text = await (await file()).text();
        S.memFiles[aid] = S.memFiles[aid] || {};
        if (entry.name==='MEMORY.md') S.memFiles[aid].memoryMd = text;
        else S.memFiles[aid].episodes = text.split('\n').filter(Boolean)
          .map(l=>{ try{return JSON.parse(l);}catch(_){return null;} }).filter(Boolean);
      }
      return;
    }
    if (entry.isDirectory){
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res,rej)=>reader.readEntries(res,rej));
        for (const c of batch) await walk(c, path+'/'+entry.name);
      } while (batch.length);
    }
  };
  for (const e of entries) await walk(e);
}

/* 拖放与入口绑定 */
function bindDnd(){
  const zone = $('#drop-zone'), box = $('#drop-box'), input = $('#file-input');
  box.onclick = ()=>input.click();
  box.onkeydown = ev=>{ if(ev.key==='Enter'||ev.key===' ') input.click(); };
  ['dragenter','dragover'].forEach(t=>zone.addEventListener(t,ev=>{
    ev.preventDefault(); box.classList.add('dragover');
  }));
  zone.addEventListener('dragleave', ev=>{
    ev.preventDefault();
    if (!zone.contains(ev.relatedTarget)) box.classList.remove('dragover');
  });
  zone.addEventListener('drop', ev=>{
    ev.preventDefault();
    box.classList.remove('dragover');
    const dirEntries = [];
    if (ev.dataTransfer.items)
      for (const it of ev.dataTransfer.items){
        const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
        if (entry && entry.isDirectory) dirEntries.push(entry);
      }
    handleFiles(ev.dataTransfer.files, dirEntries);
  });
  input.onchange = ()=>{ if (input.files.length) handleFiles(input.files, null); };
  $('#btn-reload').onclick = ()=>{
    if (S.db) S.db.close();
    S.db=null; S.events=[]; S.summaries=new Map(); S.typeCounts={}; S.obs=[]; S.acts=[];
    S.memFiles={}; S.bodyCache=new Map(); S.world=null; S.runId='';
    S.runManifest=null; S.ignoredManifests=0;
    S.nameIdx=null; S.missingNames=new Set(); S.reminded=new Map(); S.responses=new Map(); S.actById=new Map(); S.day=null;
    AT.page=0; AT.sortKey='start'; AT.sortDir=1;
    TL.inited=false; TL.types=new Set(); TL.kw=''; TL.rendered=0; TL.lo=null; TL.hi=null;
    $('#day-filter').value='';
    RS.loaded=false; RS.items=[]; RS.kw='';
    ContextView.reset();
    const sqlBody = $('#sql-body'); sqlBody.dataset.inited=''; sqlBody.innerHTML='';
    $('#app').classList.remove('on');
    $('#drop-zone').classList.remove('hidden');
    input.value='';
  };
}
window.addEventListener('resize', ()=>{
  if (!$('#app').classList.contains('on')) return;
  if (S.view==='body') renderBodyCurves();
  else if (S.view==='economy') renderEconomy();
});
bindDnd();
