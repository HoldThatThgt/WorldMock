<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldMock 运行数据查看器</title>
<link rel="stylesheet" href="run-viewer-context.css">
<style>
:root{
  --bg:#0f1115; --bg2:#161a22; --bg3:#1d232e; --line:#2a3140;
  --fg:#d7dde6; --fg-dim:#8b949e; --fg-faint:#5b636e;
  --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--fg-dim);font-weight:600;position:sticky;top:0;background:var(--bg2);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#333c4d;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 拖放区 ---------- */
#drop-zone{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:100;padding:24px}
#drop-zone.hidden{display:none}
#drop-box{border:2px dashed #3d4657;border-radius:12px;padding:60px 80px;text-align:center;cursor:pointer}
#drop-box.dragover{border-color:var(--accent);background:rgba(88,166,255,.06)}
#drop-box h1{font-size:20px;font-weight:600;margin-bottom:10px}
#drop-box p{color:var(--fg-dim);max-width:560px;line-height:1.8}
#drop-log{font-family:var(--mono);font-size:12px;color:var(--fg-dim);min-height:120px;width:560px;max-width:92vw;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;white-space:pre-wrap;display:none;overflow:auto}
#drop-err{color:var(--err);max-width:560px;text-align:center;display:none;white-space:pre-wrap}
#file-input{display:none}

/* ---------- 主布局 ---------- */
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
#topbar{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
#topbar .title{font-weight:600;font-size:14px}
#topbar .meta{color:var(--fg-dim);font-size:12px;font-family:var(--mono)}
#topbar label{color:var(--fg-dim);font-size:12px;display:flex;align-items:center;gap:6px}
#topbar .day-step{padding:2px 8px;color:var(--fg-dim)}
#layout{flex:1;display:flex;min-height:0}
#sidebar{width:168px;flex:none;background:var(--bg2);border-right:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:2px}
.nav-item{display:block;width:100%;text-align:left;background:none;border:none;border-radius:0;padding:8px 16px;color:var(--fg-dim);border-left:2px solid transparent}
.nav-item:hover{color:var(--fg);background:var(--bg3)}
.nav-item.on{color:var(--fg);background:var(--bg3);border-left-color:var(--accent)}
/* --main-pad：吸顶的分隔行与时间轴用它抵消上内边距，贴住滚动区顶边，不在内边距里漏出滚过的内容 */
#main{--main-pad:16px;flex:1;overflow:auto;padding:var(--main-pad) 20px;min-width:0}
@media(max-width:700px){
  #layout{flex-direction:column}
  #sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0}
  .nav-item{width:auto;flex:none;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:8px 10px}
  .nav-item.on{border-left-color:transparent;border-bottom-color:var(--accent)}
  #main{--main-pad:12px;padding:12px}
}
.view{display:none}
.view.on{display:block}
.view h2{font-size:16px;font-weight:600;margin-bottom:12px}
.view h3{font-size:13px;font-weight:600;color:var(--fg-dim);margin:16px 0 8px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.eco-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1100px){.g2{grid-template-columns:1fr}}
.kv{display:flex;gap:8px;padding:3px 0;font-size:13px}
.kv .k{color:var(--fg-dim);width:150px;flex:none}
.kv .v{font-family:var(--mono);word-break:break-all}
.bar-row{display:flex;align-items:center;gap:8px;padding:2px 0}
.bar-row .lbl{width:150px;flex:none;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar-bg{flex:1;height:16px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bar-row .bar{height:100%;border-radius:3px}
.bar-row .n{width:60px;flex:none;text-align:right;font-family:var(--mono);color:var(--fg-dim);font-size:12px}

/* ---------- 过滤条 ---------- */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.filter-bar label{color:var(--fg-dim);font-size:12px;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);cursor:pointer;color:var(--fg-dim);user-select:none}
.chip[data-t].on{color:#0b0d11;border-color:transparent;background:var(--c,#3d4657);font-weight:600}
.range-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-dim)}
.range-wrap input[type=range]{width:200px;max-width:28vw;accent-color:var(--accent);padding:0}

/* ---------- 时间线 ---------- */
.tl-row{display:flex;gap:10px;padding:5px 10px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.tl-row:hover{background:var(--bg3)}
.tl-time{font-family:var(--mono);font-size:12px;color:var(--fg-dim);width:60px;flex:none}
.tl-agent{flex:none;width:56px;font-size:11px;text-align:center;border-radius:3px;padding:1px 0}
.tl-type{flex:none;width:76px;font-size:11px;text-align:center;border-radius:3px;padding:1px 0}
.tl-sum{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--fg)}
/* 当地日分隔行：长运行里滚动时始终看得到正在读哪一天 */
.tl-day{position:sticky;top:calc(-1*var(--main-pad));z-index:1;padding:5px 10px;background:var(--bg3);border-bottom:1px solid var(--line);
  font:600 12px var(--mono);color:var(--fg)}
.tl-day .n{font-weight:400;color:var(--fg-dim);margin-left:8px}
.tl-detail{display:none;background:var(--bg);border-bottom:1px solid var(--line)}
.tl-detail.on{display:block;padding:10px 12px}
.tl-detail pre{max-height:480px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:#a8d4ff}
.tl-sentinel{height:40px;display:flex;align-items:center;justify-content:center;color:var(--fg-faint)}
.badge-a1{background:rgba(88,166,255,.18);color:#79b8ff}
.badge-a2{background:rgba(63,185,80,.16);color:#7ee787}
.badge-a0{background:var(--bg3);color:var(--fg-dim)}

/* ---------- 活动表格 ---------- */
.act-table th{cursor:pointer;user-select:none;white-space:nowrap}
.act-table th:hover{color:var(--fg)}
.act-table th .arrow{font-size:10px;margin-left:3px;color:var(--accent)}
.act-kind{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px}
/* 泳道每行一个当地日，横轴固定为 00:00–24:00：运行再长，条块的宽度也只取决于活动自身的时长 */
.act-lanes{margin-bottom:14px}
.act-lane{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.act-lane-label{width:92px;flex:none;padding:3px 8px 3px 0;background:none;border:0;border-radius:0;text-align:left;
  font:12px var(--mono);color:var(--fg-dim);white-space:nowrap}
.act-lane-label:hover{color:var(--accent)}
.act-lane.weekend .act-lane-label{color:var(--warn)}
.act-lane-track{position:relative;flex:1;min-width:0;border-right:1px solid var(--line);
  background:repeating-linear-gradient(to right,var(--line) 0,var(--line) 1px,transparent 1px,transparent 12.5%)}
.act-lane-bar{position:absolute;height:14px;min-width:3px;border-radius:3px;overflow:hidden;container-type:inline-size}
.act-lane-text{display:block;padding:0 4px;font-size:11px;line-height:14px;color:#0b0d11;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
@container (max-width:44px){.act-lane-text{display:none}}
.act-lane-axis{position:sticky;top:calc(-1*var(--main-pad));z-index:2;height:22px;margin-left:92px;background:var(--bg2);
  border-bottom:1px solid var(--line);color:var(--fg-dim);font:11px var(--mono)}
.act-lane-axis span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.act-lane-axis span:first-child{transform:none}
.act-lane-axis span:last-child{transform:translateX(-100%)}
.memory-entry{border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;background:var(--bg3);border-radius:3px}
.memory-entry .meta{color:var(--fg-dim);font-size:11px;margin-bottom:4px}
.memory-entry .text{white-space:pre-wrap;overflow-wrap:anywhere}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:8px 2px;color:var(--fg-dim);font-size:12px}
.pager button:disabled{opacity:.4;cursor:default}

/* ---------- 图表 ---------- */
.chart-block{margin-bottom:14px}
.chart-block .chart-title{color:var(--fg-dim);font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.chart-block canvas{width:100%;height:120px;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:6px;cursor:crosshair}
#eco-canvas{width:100%;height:220px;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:6px;cursor:crosshair}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 2px;font-size:12px;color:var(--fg-dim)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- 记忆 / 思考 ---------- */
.mem-file{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.mem-file h4{font-size:13px;margin-bottom:8px;color:var(--accent);font-family:var(--mono)}
.mem-file pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;color:var(--fg);max-height:420px;overflow:auto}
.rs-item{border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer}
.rs-item:hover{background:var(--bg3)}
.rs-head{display:flex;gap:10px;align-items:baseline}
.rs-head .t{font-family:var(--mono);font-size:12px;color:var(--fg-dim);width:60px;flex:none}
.rs-head .a{flex:none;width:56px;font-size:11px;text-align:center;border-radius:3px}
.rs-head .x{color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rs-body{display:none;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--line)}
.rs-body.on{display:block}
.rs-body pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.6;color:#c8d8f0;max-height:420px;overflow:auto}
.hint{color:var(--fg-dim);background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;line-height:1.8}

/* ---------- SQL 控制台 ---------- */
#sql-input{width:100%;height:90px;font-family:var(--mono);font-size:12px;resize:vertical;margin-bottom:8px}
#sql-out{overflow:auto;max-height:60vh;background:var(--bg2);border:1px solid var(--line);border-radius:6px;margin-top:8px}
#sql-msg{font-family:var(--mono);font-size:12px;color:var(--fg-dim);margin-top:6px}
#sql-msg.err{color:var(--err)}
.empty{color:var(--fg-faint);padding:24px;text-align:center}
/* ---------- 一天视图（timeline markdown） ---------- */
#day-drop{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;margin-bottom:10px}
#day-drop.dragover{border-color:var(--accent)}
#day-drop p{color:var(--fg-dim)}
#day-paste{width:100%;font-family:var(--mono);font-size:12px;resize:vertical;margin-bottom:8px;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
</style>
</head>
<body>

<!-- ============ 拖放区 ============ -->
<div id="drop-zone">
  <div id="drop-box" role="button" tabindex="0">
    <h1>拖入 footprints.sqlite</h1>
    <p>将运行产生的 SQLite 足迹文件拖到此处，或点击选择文件。<br>
       记忆正文从 SQLite 事件读取；拖入整个 run 目录还可读取人物的 <code>MEMORY.md</code> 总结。<br>
       同一 run 目录的运行清单 <code>manifest.json</code> 一起拖入或选择时，总览列出运行输入警告。<br>
       地点名称和活动标题直接读取运行记录。<br>
       所有数据只在本地浏览器内解析，不会上传。</p>
  </div>
  <input type="file" id="file-input" accept=".sqlite,.db,.sqlite3,.json" multiple>
  <div id="drop-err"></div>
  <div id="drop-log"></div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app">
  <div id="topbar">
    <span class="title">WorldMock 运行查看器</span>
    <span class="meta" id="run-meta"></span>
    <span style="flex:1"></span>
    <label title="只看一个当地日：作用于时间线、活动泳道、身体曲线、经济流水、记忆、思考记录与上下文">日期
      <button type="button" class="day-step" id="day-prev" title="前一天">‹</button>
      <select id="day-filter"><option value="">全部</option></select>
      <button type="button" class="day-step" id="day-next" title="后一天">›</button>
    </label>
    <label>Agent
      <select id="agent-filter"><option value="">全部</option></select>
    </label>
    <button id="btn-reload" title="重新选择文件">换一个文件</button>
  </div>
  <div id="layout">
    <nav id="sidebar"></nav>
    <div id="main">
      <section class="view" data-view="overview"><h2>总览</h2><div id="ov-body"></div></section>
      <section class="view" data-view="timeline"><h2>时间线</h2><div id="tl-body"></div></section>
      <section class="view" data-view="day"><h2>一天</h2><div id="day-body"></div></section>
      <section class="view" data-view="activities"><h2>活动泳道</h2><div id="act-body"></div></section>
      <section class="view" data-view="body"><h2>身体曲线</h2><div id="bd-body"></div></section>
      <section class="view" data-view="economy"><h2>经济流水</h2><div id="eco-body"></div></section>
      <section class="view" data-view="memory"><h2>记忆</h2><div id="mem-body"></div></section>
      <section class="view" data-view="reasoning"><h2>思考记录</h2><div id="rs-body"></div></section>
      <section class="view" data-view="context"><h2>上下文</h2><div id="ctx-body"></div></section>
      <section class="view" data-view="sql"><h2>SQL 查询</h2><div id="sql-body"></div></section>
    </div>
  </div>
</div>

<script src="run-viewer-engine.js"></script>
<script src="run-viewer-context.js"></script>
<script src="run-viewer-context-view.js"></script>
<script>
'use strict';
/* ================================================================
 * WorldMock 运行数据查看器 —— 纯前端页面，SQLite WASM 读取 footprints.sqlite（引擎与分块读文件见
 * run-viewer-engine.js）。
 * 两级数据策略：SQL 投影建立轻量索引（json_extract 在 SQLite C 层完成，不把上百 MB 的事件 body 拉进 JS），
 * 行内全文按 event_seq 懒加载缓存。事件正文只在取它那一类的字段时解析一次（见「事件类型索引」）。
 * ================================================================ */

/* ---------- 全局状态 ---------- */
const S = {
  engine: null, db: null, fileName: '',
  events: [],            // {seq,t,agent,type,sum} 按 seq 升序
  summaries: new Map(),  // seq -> 摘要字段对象
  typeCounts: {},
  agents: {}, agentIds: [],
  t0: 0, t1: 0, runId: '', tz: 'Asia/Shanghai',
  world: null,
  obs: [],               // {seq,t,agent,bal,en,sl,et}
  acts: [],              // 合并后的活动段
  actById: new Map(),    // 活动身份 -> 活动段，供受理摘要按身份写活动名
  memFiles: {},          // agentId -> {memoryMd, episodes:[]}
  runManifest: null,     // {path, frozen, manifest}：随库提供的本运行冻结清单（frozen 表示取自导出清单）
  ignoredManifests: 0,   // 随库提供、却不是本库所属运行清单的 manifest.json 个数
  nameIdx: null,         // {locations:Map, targets:Map} 来自本次运行记录
  missingNames: new Set(), // 已报告名称缺失的对象
  reminded: new Map(),   // 「人物@时刻」-> [{seq,name}]：事务提醒事件，供唤醒原因写事务名称
  responses: new Map(),  // 事件身份 -> [seq]：caused_by 写着它的模型响应，供上下文视图按因果找响应
  fmt: null, tzOff: 28800,
  view: 'overview',
  day: null,             // {title, rows[], source} 解析后的 render_day timeline markdown
  bodyCache: new Map(),  // seq -> body 文本（FIFO 上限）
};
const BODY_CACHE_MAX = 40;

/* ---------- 工具函数 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => (n==null||isNaN(n))?'—':Number(n).toLocaleString('zh-CN');
function makeFmt(tz){
  /* 注意：新版 V8 中 Intl.DateTimeFormat 实例本身不可调用，必须走 .format() */
  const mk = extra => { const f = new Intl.DateTimeFormat('zh-CN',{timeZone:tz,hour12:false,...extra}); return d => f.format(d); };
  return {
    full: mk({year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}),
    mdhm: mk({month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
    md:   mk({month:'2-digit',day:'2-digit'}),
    date: mk({year:'numeric',month:'2-digit',day:'2-digit'}),
    hms:  mk({hour:'2-digit',minute:'2-digit',second:'2-digit'}),
    hm:   mk({hour:'2-digit',minute:'2-digit'}),
    wd:   mk({weekday:'short'}),
  };
}
/* 模拟时区在 t 时刻的 UTC 偏移（秒），用于画当地日分界线 */
function tzOffsetSec(tz, t){
  const p = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',
    day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})
    .formatToParts(new Date(t*1000)).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return Math.round((Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second) - t*1000)/1000);
}
const fmtT = t => t==null?'—':S.fmt.full(new Date(t*1000));
const fmtHM = t => t==null?'—':S.fmt.mdhm(new Date(t*1000));
const fmtClock = t => t==null?'—':S.fmt.hms(new Date(t*1000));

/* ---------- 当地日 ----------
 * 长运行按当地日阅读：日的划分用模拟时区在运行起点的 UTC 偏移（S.tzOff），与曲线图的日分界线同一口径。 */
/** @brief 时刻 t 所在当地日的序号（自 1970-01-01 起的当地日数）。 */
const dayIndex = t => Math.floor((t + S.tzOff)/86400);
/** @brief 当地日 day 的零点时刻。 */
const dayStart = day => day*86400 - S.tzOff;
/** @brief 当地日的显示名「月/日 周几」。 */
const dayLabel = day => { const date = new Date(dayStart(day)*1000); return `${S.fmt.md(date)} ${S.fmt.wd(date)}`; };
/** @brief 当地日是否周末（1970-01-01 是周四，序号对 7 取余为 2、3 的是周六、周日）。 */
const isWeekend = day => { const rest = ((day%7)+7)%7; return rest===2 || rest===3; };
/** @brief 全局日期筛选选中的当地日 [零点, 次日零点)；选「全部」时为 null。 */
function dayRange(){
  const value = $('#day-filter').value;
  return value===''||value==null? null : [dayStart(+value), dayStart(+value+1)];
}
/** @brief 时刻 t 是否落在日期筛选之内（未筛选时恒真）。 */
const inDay = t => { const range = dayRange(); return !range || (t>=range[0] && t<range[1]); };
/** @brief 区间 [start, end] 是否与日期筛选的那一天有交集；零时长的区间按其时刻判断。 */
const overlapsDay = (start, end) => {
  const range = dayRange();
  return !range || (start<range[1] && (end>range[0] || start>=range[0]));
};
/** @brief 改选日期（'' 为全部）并重绘当前视图；SQL 控制台是原始数据视图，不联动。 */
function selectDay(value){
  $('#day-filter').value = value;
  if (S.view!=='sql') switchView(S.view);
}
const fmtDur = sec => {
  if (sec==null||isNaN(sec)) return '—';
  sec = Math.round(sec);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60);
  return h? `${h}小时${m?m+'分':''}` : (m? `${m}分` : `${sec}秒`);
};

/* 个人事务没有有效名称时的缺失提示：事务内部身份不进时间线，括号里写对象种类而不写编号 */
const ERRAND_NAME_MISSING = '名称缺失（个人事务）';

/** @brief 事务快照里的有效名称：非空且不同于事务内部身份才有效，否则为 null。身份只用于这一次比较，不留在索引里。 */
function errandName(name, id){
  return typeof name==='string' && name.trim() && name.trim()!==String(id??'') ? name : null;
}

/** @brief 同一缺失只输出一次英文错误日志（key 区分缺失的对象，更换数据库时随缺失记录清空）。 */
function reportMissing(key, ...message){
  if (S.missingNames.has(key)) return;
  console.error(...message);
  S.missingNames.add(key);
}

/** @brief 事务名称只取记录所写（事件 seq 的事务快照，经 errandName 判定有效），写成「名称」；记录里没有有效名称时显示
 *  缺失提示并输出英文错误日志，事务内部身份不作替代显示。 */
function errandLabel(name, seq){
  if (typeof name==='string') return `「${name}」`;
  reportMissing(`errand-name@event:${seq}`, 'Missing recorded errand name at event', seq);
  return ERRAND_NAME_MISSING;
}

/** @brief 个人事务事件的事务名称与商品：都取自事件载荷的事务快照，商品按名称索引显示（缺名照缺失提示），
 *  快照里的事务内部身份不读出；不是事务事件时为空。 */
function errandText(seq, s){
  if (!ERRAND_KINDS.has(s.ekind)) return '';
  return ` · ${errandLabel(s.errand, seq)}${s.product? ' · 商品 '+targetLabel(s.product):''}`;

/** @brief 事务提醒事件（errand_reminded）按「人物@时刻」归组并保持事件顺序，供决策开始的唤醒原因写事务名称。 */
function buildReminders(){
  S.reminded = new Map();
  for (const e of S.events){
    const s = S.summaries.get(e.seq);
    if (e.type!=='environment_event' || s?.ekind!=='errand_reminded') continue;
    const key = `${e.agent}@${e.t}`;
    if (!S.reminded.has(key)) S.reminded.set(key, []);
    S.reminded.get(key).push({seq:e.seq, name:s.errand});
  }
}

/** @brief 唤醒原因 errand_reminder_due 所指事务的名称：同一人物在同一时刻、排在该决策之前交付的事务提醒事件
 *  快照里的名称，按交付顺序逐个写出；记录里没有对应的提醒事件时在原因说法之后显示缺失提示并输出英文错误日志。
 *  缺失提示与原因说法之间空一格，名称直接相连。 */
function remindedErrands(e){
  const rows = (S.reminded.get(`${e.agent}@${e.t}`)||[]).filter(row=>row.seq<e.seq);
  if (!rows.length){
    reportMissing(`errand-reminder@event:${e.seq}`, 'Missing errand reminder record for wake reason at event', e.seq);
    return ` ${ERRAND_NAME_MISSING}`;
  }
  return rows.map(row=>errandLabel(row.name, row.seq))
    .map(label=>label===ERRAND_NAME_MISSING? ` ${label}` : label).join('');
}

/* ---------- 查询封装 ---------- */
/** @brief 逐行执行查询并把每一行交给 fn，不把整个结果集留在内存里（一次观察的名称数组就有上百 KB）。 */
function eachRow(sqlText, params, fn){
  const stmt = S.db.prepare(sqlText);
  try{
    stmt.bind(params||[]);
    while(stmt.step()) fn(stmt.getAsObject());
  } finally { stmt.free(); }
}
function q(sqlText, params){
  const rows=[];
  eachRow(sqlText, params, row=>rows.push(row));
  return rows;
}

/* ---------- 事件类型索引 ----------
 * 事件正文是大段 JSON，按类型筛选若写成 WHERE json_extract(body,'$.event_type')=…，每条语句都得把全部事件解析一遍。
 * 这里先把（序号，类型，人物）抄进临时表，此后各类查询从临时表按类型取序号、再按主键读正文：一条事件只在取它那
 * 一类的字段时解析。两个表达式的写法与足迹库的表达式索引 events_agent_type 一致，有这个索引的库建表时不读正文。 */
function indexEventTypes(){
  q('DROP TABLE IF EXISTS temp.viewer_event');
  q(`CREATE TEMP TABLE viewer_event AS SELECT event_seq, json_extract(body,'$.event_type') AS type,
     json_extract(body,'$.agent_id') AS agent FROM events`);
  q('CREATE INDEX temp.viewer_event_type ON viewer_event(type, event_seq)');
}
/* 某一类事件的行来源（接在 FROM 之后）：v 是类型索引的行，e 是事件本身；类型作第一个绑定参数。 */
const EVENTS_OF_TYPE = 'viewer_event v CROSS JOIN events e ON e.event_seq=v.event_seq WHERE v.type IS ?';
const parseJArr = text => { try{ return JSON.parse(text); }catch(e){ return []; } };

/* ---------- 名称索引 ----------
 * 名称随建索引时各类字段的那一次查询取出（观察里的八个数组、活动自身的标题），不另开查询、不再解析一遍事件正文。
 * 各来源先各自累积，最后按固定的先后合并：前六个来源后写的覆盖先写的，后两个只给还没有名称的对象补缺。 */
/** @brief 一条名称记录是否有效：对象身份非空，名称是非空字符串且不同于对象身份。 */
const validName = (id, label) => Boolean(id) && typeof label==='string' && label.trim()!=='' && label.trim()!==id;
/** @brief 覆盖式累积：同一对象留最后一次记录的有效名称，稀疏观察不会清除此前的记录。 */
function keepLastName(names, id, label){
  if (validName(id, label)) names.set(id, label);
}
/** @brief 补缺式累积：同一对象留最先记录的有效名称。 */
function keepFirstName(names, id, label){
  if (validName(id, label) && !names.has(id)) names.set(id, label);
}
/** @brief 按码点比较两个字符串（与 SQLite 默认的逐字节比较同序）。 */
function codePointCompare(a, b){
  const x = Array.from(a), y = Array.from(b);
  for (let i=0; i<x.length && i<y.length; i++){
    const delta = x[i].codePointAt(0) - y[i].codePointAt(0);
    if (delta) return delta;
  }
  return x.length - y.length;
}
/** @brief 事务商品名的累积：同一商品留最早那次观察里的有效名称，同一次观察里有几种写法时取码点序最小的一个
 *  （即按（商品，名称）归并、依最早出现与名称排列后的第一行）。 */
function keepEarliestName(names, id, label, seq){
  if (!validName(id, label)) return;
  const kept = names.get(id);
  if (!kept) names.set(id, {seq, label});
  else if (kept.seq===seq && codePointCompare(label, kept.label)<0) kept.label = label;
}
/** @brief JSON 文本里数组的各项（对象则取各成员的值）；不是字符串、解析不了或是标量时为空。 */
function jsonItems(text){
  if (typeof text!=='string') return [];
  let value;
  try{ value = JSON.parse(text); }catch(_){ return []; }
  if (Array.isArray(value)) return value;
  return value!==null && typeof value==='object'? Object.values(value) : [];
}
/* 观察事件里带名称的八个数组：[路径, 身份键, 名称键, 来源, 累积方式]。邮件主题另加「邮件「…」」的写法。 */
const OBSERVED_NAMES = [
  ['$.data.locations', 'location_id', 'name', 'locations', keepLastName],
  ['$.data.foods', 'food_id', 'name', 'foods', keepLastName],
  ['$.data.apps', 'app_id', 'name', 'apps', keepLastName],
  ['$.data.contents', 'content_id', 'title', 'contents', keepLastName],
  ['$.data.work_topics', 'topic_id', 'topic', 'workTopics', keepLastName],
  ['$.data.messages', 'message_id', 'subject', 'messages', keepLastName],
  ['$.data.interaction_bindings', 'object_id', 'object', 'bindings', keepFirstName],
  ['$.data.errand_item_bindings', 'product_id', 'name', 'errandItems', keepEarliestName],
];
/** @brief 新建一组空的名称来源；seen 记各来源上一次读到的数组原文。 */
function nameSources(){
  const sources = {seen:{}};
  for (const name of ['locations','foods','apps','contents','workTopics','messages','titles','bindings','errandItems'])
    sources[name] = new Map();
  return sources;
}
/** @brief 读一次观察（查询行 row）里的八个名称数组。数组原文与同一来源上一次读到的相同时跳过：个人事务的商品目录
 *  每次观察都整份列出，三种累积方式对重复的记录都不变。 */
function observeNames(sources, row){
  for (const [path, idKey, labelKey, source, keep] of OBSERVED_NAMES){
    const text = row[path];
    if (text===sources.seen[source]) continue;
    sources.seen[source] = text;
    for (const item of jsonItems(text)){
      if (item===null || typeof item!=='object') continue;
      const label = item[labelKey];
      if (source!=='messages') keep(sources[source], item[idKey], label, row.seq);
      else if (validName(item[idKey], label)) keep(sources[source], item[idKey], `邮件「${label}」`);
    }
  }
}
/** @brief 合并各名称来源为名称索引。地点只有一个来源；其余对象依次写食品、app、内容、工作主题、邮件与活动自身的
 *  标题（取自已读出的受理与进展摘要），再由交互绑定与事务商品目录补缺，后者按最早出现、商品身份的先后补。 */
function buildNameIndex(sources){
  for (const e of S.events){
    if (e.type!=='action_accepted' && e.type!=='activity_progress') continue;
    const s = S.summaries.get(e.seq);
    if (s) keepLastName(sources.titles, s.tg, s.title);
  }
  const targets = new Map();
  for (const source of ['foods','apps','contents','workTopics','messages','titles'])
    for (const [id, label] of sources[source]) targets.set(id, label);
  for (const [id, label] of sources.bindings) keepFirstName(targets, id, label);
  const errandItems = [...sources.errandItems].sort((x, y)=>
    x[1].seq-y[1].seq || codePointCompare(String(x[0]), String(y[0])));
  for (const [id, kept] of errandItems) keepFirstName(targets, id, kept.label);
  S.nameIdx = {locations:sources.locations, targets};
}

/* ================================================================
 * 索引构建
 * ================================================================ */
function buildIndex(){
  const log = m => { const el=$('#drop-log'); el.textContent += m+'\n'; el.scrollTop = el.scrollHeight; };
  S.fmt = makeFmt(S.tz); /* 先建默认格式器：makeSummary 会格式化 run_ended 时间 */

  log('· 读取事件索引 …');
  indexEventTypes();

  /* 按类型投影摘要字段：每类一条语句，只读这一类的事件（列名用双引号别名取路径写法）；事件的发生时刻随它那一类
     的字段一并取出，一条事件正文只解析这一次。 */
  const times = new Map(), projected = new Set(), names = nameSources();
  const P = paths => paths.map(p=>`json_extract(e.body,'${p}') AS "${p}"`).join(',');
  const typeQuery = (type, paths, fn) => {
    projected.add(type);
    eachRow(`SELECT v.event_seq AS seq, ${P(['$.occurred_at', ...paths])} FROM ${EVENTS_OF_TYPE}
             ORDER BY v.event_seq`, [type], r=>{ times.set(r.seq, r['$.occurred_at']); fn(r); });
  };

  typeQuery('decision_started', ['$.data.round_order','$.data.wake_reasons'], r=>{
    S.summaries.set(r.seq,{round:r['$.data.round_order'],wake:parseJArr(r['$.data.wake_reasons'])});
  });
  typeQuery('observation', ['$.data.balance_fen','$.data.body.values.energy_kcal',
                            '$.data.body.values.sleep_deficit_hours','$.data.body.values.entertainment_need',
                            '$.data.active_activities','$.data.calendar_context.date',
                            ...OBSERVED_NAMES.map(([path])=>path)],
  r=>{
    observeNames(names, r);
    S.summaries.set(r.seq,{bal:r['$.data.balance_fen'],en:r['$.data.body.values.energy_kcal'],
      sl:r['$.data.body.values.sleep_deficit_hours'],et:r['$.data.body.values.entertainment_need'],
      acts:parseJArr(r['$.data.active_activities']),date:r['$.data.calendar_context.date']});
    S.obs.push({seq:r.seq, t:null, agent:null, bal:r['$.data.balance_fen'],
      en:r['$.data.body.values.energy_kcal'], sl:r['$.data.body.values.sleep_deficit_hours'],
      et:r['$.data.body.values.entertainment_need']});
  });
  typeQuery('action_requested', ['$.data.tool_name','$.data.request','$.data.self_note'], r=>{

  S.t0 = S.events.length? S.events[0].t : 0;
  S.t1 = S.events.length? S.events[S.events.length-1].t : 0;

  /* 观测的 agent/时间补全（从事件索引查，不重复解析 body） */
  const bySeq = new Map(S.events.map(e=>[e.seq,e]));
  for (const o of S.obs){ const e=bySeq.get(o.seq); if(e){ o.t=e.t; o.agent=e.agent; } }

  buildNameIndex(names);

  buildActivities();   /* 先合并活动段：受理摘要要按活动身份写出活动名 */

  const rid = q(`SELECT json_extract(body,'$.run_id') AS r FROM events LIMIT 1`)[0];

  if (!Object.keys(S.agents).length) S.agentIds.forEach(id=>S.agents[id]='agent '+id);
  S.fmt = makeFmt(S.tz);
  try{ S.tzOff = tzOffsetSec(S.tz, S.t0||Math.floor(Date.now()/1000)); }catch(e){ S.tzOff = 28800; }

  log(`· 索引完成：${S.events.length} 事件 / ${S.agentIds.length} agent / ${S.obs.length} 观测 / ${S.acts.length} 活动段`);

/** @brief 控制工具请求逐项读取活动名与自述；结束工具合并普通记忆与看法，播报和暂停没有记忆。
 * 请求级 errands 必须是数组，缺键即报错。 */
function controlItems(tool, req){
  if (!req || !Array.isArray(req.items)) throw new Error('Activity control request requires items');
  if (!Array.isArray(req.errands)) throw new Error('Activity control request requires errands');
  return req.items.map(item=>({
    name:item.activity_name, summary:item.summary,
    memories:[...(item.memories||[]),...(item.views||[]).map(view=>({...view,subject:view.about}))]
  }));
}

/* 一条个人事务变更的八个键，与 worldmock.life.control_items 的 _ERRAND_KEYS 相同、同一顺序，全部必填 */
const ERRAND_CHANGE_KEYS = ['change', 'name', 'outcome', 'item', 'quantity', 'memo', 'remind_time', 'reason'];

/** @brief 控制工具请求里请求级的个人事务变更，worldmock.life.control_items.control_errands 的镜像，规则相同：errands 须是
 *  数组，每条须是对象且八个键齐全（只查键在不在，不查值的类型），不符即报错；按请求顺序返回只含这八个键的对象，
 *  值照请求所写。 */
function controlErrands(req){
  if (!req || !Array.isArray(req.errands)) throw new Error('Activity control request requires errands');
  return req.errands.map(entry=>{
    if (!entry || typeof entry!=='object' || Array.isArray(entry))
      throw new Error('Activity control request errand change is not an object');
    const change = {};
    for (const key of ERRAND_CHANGE_KEYS){
      if (!(key in entry)) throw new Error(`Activity control request errand change lacks ${key}`);
      change[key] = entry[key];
    }
    return change;
  });
}

function pairedSummaries(tool, req){
  return controlItems(tool, req).map(item=>`${item.name}：${item.summary}`).join('；');
}
/** @brief 控制请求摘要里的事务变更：逐条写种类（新增、更新、取消，照请求所写）与「事务名称」；没有变更时为空。 */
function errandChanges(req){
  const changes = controlErrands(req).map(entry=>`${entry.change}「${entry.name}」`);
  return changes.length? ` · 事务：${changes.join('、')}` : '';
}
/** @brief conclude_activity 收尾写下的普通记忆与看法条数。 */
function memoryCount(req){
  const items = controlItems('conclude_activity', req);
  return ` · 记忆 ${items.reduce((total,item)=>total+item.memories.length,0)} 条`;
}
/** @brief 零点计划的目标数与提醒时刻（场景时区）。 */
function dayPlanText(goalsRaw){
  const goals = parseJArr(goalsRaw||'[]');
  const reminders = goals.filter(g=>g && g.remind_at!=null).map(g=>fmtHM(g.remind_at));
  return ` · ${goals.length} 项目标${reminders.length?' · 提醒 '+reminders.join('、'):''}`;
}

/* 把 action_requested 的 request 参数渲染成可读中文（隐藏技术编号） */
function readableReq(tool, reqRaw){
  let req = null;
  try{ req = typeof reqRaw==='string'? JSON.parse(reqRaw) : reqRaw; }
  catch(error){ console.error('Invalid action request JSON:', error); return ''; }
  if (!req || typeof req!=='object') return '';
  switch (tool){
    case 'start_activity':
      return (req.items||[]).map(item=>`${item.target} · ${item.way}`).join('；');
    case 'query_world':
      return `${req.name||req.category||req.way||''} · 偏移 ${req.offset}`;
    case 'recall_task_summary':
      return req.task_name||'';
    case 'report_status':
    case 'pause_activity':
      return pairedSummaries(tool, req) + errandChanges(req);
    case 'conclude_activity':
      return pairedSummaries(tool, req) + memoryCount(req) + errandChanges(req);
    case 'send_message':
      return `${req.recipient_name||''} · ${req.text||''}`;
    case 'revise_day_plan':
      return `${(req.goals||[]).length} 项目标`;
    default: return '';
  }
}
function makeSummary(e){
  const s = S.summaries.get(e.seq)||{};
  switch(e.type){
    case 'decision_started': {
      const wake = wakeLabels(s.wake, e);
      return `决策开始 · 第 ${s.round??'?'} 轮${wake?' · 唤醒：'+wake:''}`;
    }
    case 'observation': {
      const active = (s.acts||[]).map(a=>kindLabel(a.kind)).filter(Boolean);
      return `余额 ¥${fmtFen(s.bal)} · 能量 ${s.en==null?'—':Math.round(s.en)}kcal` +
        ` · 睡眠缺口 ${s.sl==null?'—':(+s.sl).toFixed(1)}h` +
        ` · 娱乐需求 ${s.et==null?'—':(+s.et).toFixed(2)}` +
        (active.length?' · 进行中：'+active.join('、'):'');
    }
    case 'model_request':
      return `${s.purpose==='plan_day'?'零点计划模型请求':'模型请求'} ${s.model||''} · 第${s.attempt??'?'}次尝试`;
    case 'model_response': return `模型响应 ${s.model||''} · prompt ${nf(s.pt)} + completion ${nf(s.ct)} = ${nf(s.tt)} tokens`;
    case 'action_requested': return `请求 ${toolLabel(s.tool)} · ${readableReq(s.tool, s.req)}` +
      (s.note ? ` · self_note（未经核验）：${s.note}` : '');
    case 'action_accepted':
      /* 不开启活动的受理（播报、暂停、结束、购买、发消息）没有活动种类与计划时长：控制工具的结果只记所涉活动的
         身份，这里换成各活动的种类与名称；查不到的活动不写，身份不进摘要 */
      if (!s.kind){
        const named = (s.aids||[]).map(aid=>S.actById.get(aid)).filter(Boolean).map(actFullLabel);
        return `已受理${named.length? ' · '+named.join('、') : ''}`;
      }
      return `已受理 · ${actTypeLabel(s.kind, s.tg)}${s.tg||s.dest? ' · '+actTargetText(s):''}` +
        ` · 计划 ${fmtDur(s.dur)}`;
    case 'action_rejected':
      return `被拒绝 · ${s.err||'—'} · 同刻第 ${s.smr??'?'} 轮` +
        (s.smmax!=null?`（上限 ${s.smmax}）`:'');
    case 'action_result': {
      const ord=(s.orders||[]).map(o=>` · 订单 ${targetLabel(o.food_id)} ¥${fmtFen(o.total_price_fen)}`).join('');
      return `结果 ${statusLabel(s.status)}${s.msg?' · '+s.msg:''}${s.err?' · '+s.err:''}${ord}`;
    }
    case 'activity_progress':
      return `活动段 · ${actTypeLabel(s.kind, s.tg)}${s.tg||s.dest? ' '+actTargetText(s):''}` +
        ` · ${statusLabel(s.status)} · 已进行 ${fmtDur(s.elapsed)}${s.bnd?' · '+bndLabel(s.bnd):''}`;
    case 'memory_updated': {
      const n = parseJArr(s.created||'[]').length + parseJArr(s.merged||'[]').length;
      return `记忆更新 · ${MEMOP_LABELS[s.op]||s.op||'—'} · ${n} 段记忆${s.cons?' · 已巩固':''}`;
    }
    case 'checkpoint_created': return '存档';
    case 'environment_event':
      return `世界事件 · ${envkLabel(s.ekind)||'—'}${s.aname?' · '+s.aname:''}` +
        (s.ekind==='day_plan_generated'?dayPlanText(s.goals):'') + errandText(e.seq, s) +
        (s.ekind==='app_push' && s.app ? ` · ${s.app} · 《${s.content}》` +
          `（${CONTENT_KIND_LABELS[s.contentKind]}） · ${s.summary}` : '') +
        (s.ekind==='work_topic_completed' ? ` · ${targetLabel(s.topic)}` : '');
    case 'run_ended': return `运行结束 · 模拟时间 ${fmtT(s.end)} · 墙钟 ${fmtDur(Math.round((s.wall||0)/1000))}`;
    default: return '';
  }
}

/** @brief 合并同一活动的实际结算区间，保留暂停造成的空档。 */
function mergeIntervals(intervals){
  const merged = [];
  for (const [start,end] of intervals.sort((a,b)=>a[0]-b[0])){
    const last = merged[merged.length-1];
    if (last && start<=last[1]) last[1] = Math.max(last[1],end);
    else merged.push([start,end]);
  }
  return merged;
}

/* 活动段合并：同一 activity_id 取最新状态（受理与进展按真实 activity_id 归并） */
function buildActivities(){
  const map = new Map();
  for (const e of S.events){
    if (e.type!=='activity_progress' && e.type!=='action_accepted') continue;
    const s = S.summaries.get(e.seq);
    if (!s || !s.kind) continue;   /* 无 data.activity 的受理（如购买）不构成活动段 */
    const aid = s.aid || `(accepted@${e.seq})`;
    let a = map.get(aid);
    if (!a){ a = {aid, agent:e.agent, kind:s.kind||'?', start:s.start??e.t, end:null,
                   status:s.status||'active', elapsed:0, tg:null, dest:null, title:null, intervals:[]};
             map.set(aid,a); }
    if (s.kind) a.kind = s.kind;
    if (s.start!=null && s.start < a.start) a.start = s.start;
    if (s.end!=null) a.end = Math.max(a.end??0, s.end);
    if (s.status) a.status = s.status;
    if (s.elapsed!=null) a.elapsed = Math.max(a.elapsed, s.elapsed);
    if (a.tg==null && s.tg!=null && s.tg!=='') a.tg = s.tg;
    if (a.dest==null && s.dest!=null && s.dest!=='') a.dest = s.dest;
    if (s.origin!=null) a.origin = s.origin;
    if (s.path?.length) a.path = s.path;
    if (typeof s.title==='string' && s.title.trim() && s.title.trim()!==s.tg) a.title = s.title;
    if (e.type==='activity_progress' && s.from!=null && s.to>s.from) a.intervals.push([s.from,s.to]);
  }
  for (const a of map.values()){
    a.intervals = mergeIntervals(a.intervals);
    a.actualSeconds = a.intervals.reduce((total,[start,end])=>total+end-start,0);
    if (a.end==null) a.end = a.intervals.at(-1)?.[1] ?? a.start;
    if (a.end < a.start) a.end = a.start;
  }
  S.actById = map;
  S.acts = [...map.values()].sort((x,y)=> x.agent-y.agent || x.start-y.start);
}

/* 懒加载事件全文（FIFO 缓存） */
function fetchBody(seq){
  if (S.bodyCache.has(seq)) return S.bodyCache.get(seq);
  const r = q('SELECT body FROM events WHERE event_seq=?',[seq]);
  const text = r[0]?.body || '';
  if (S.bodyCache.size >= BODY_CACHE_MAX){
    const first = S.bodyCache.keys().next().value;
    S.bodyCache.delete(first);
  }
  S.bodyCache.set(seq, text);
  return text;
}
function prettyBody(seq){
  const text = fetchBody(seq);
  try{
    let pretty = JSON.stringify(JSON.parse(text),null,2);
    if (pretty.length > 400000) pretty = pretty.slice(0,400000)+`\n…（已截断，全文 ${pretty.length} 字符）`;
    return pretty;
  }catch(_){ return text.slice(0,400000); }
}

/** @brief 各人物的模型响应次数与 token 用量合计，取自建索引时读出的各次响应用量，不再查库。口径同按人物分组的
 *  COUNT 与 SUM：没有人物的一组排最前，其余按人物编号；某项用量在一组里全缺时合计为空。 */
function modelUsage(){
  const groups = new Map();
  for (const e of S.events){
    if (e.type!=='model_response') continue;
    if (!groups.has(e.agent)) groups.set(e.agent, {agent:e.agent, n:0, p:null, c:null, t:null});
    const group = groups.get(e.agent), usage = S.summaries.get(e.seq)||{};
    group.n++;
    for (const [key, value] of [['p',usage.pt], ['c',usage.ct], ['t',usage.tt]]){
      if (value!=null) group[key] = (group[key]??0) + value;
    }
  }
  return [...groups.values()].sort((x,y)=>x.agent==null? -1 : (y.agent==null? 1 : x.agent-y.agent));
}

/* ---------- 运行输入警告 ---------- */
/** @brief 本库所属运行的冻结运行清单：清单本身，或导出清单 frozen_run_manifest 中的那一份。以世界状态的 run_id 认定
 *  （引擎打开运行时核对二者一致；恢复分支的库以父运行的事件开头，首个事件的 run_id 不是本运行）；带 agent_ids 才是
 *  运行清单，同一 run 目录里 LabelKit 输入、手机来源等清单也写着同一个 run_id。 */
function ownRunManifest(value){
  const runId = S.world?.run_id;
  const own = m => runId!=null && m!==null && typeof m==='object' && m.run_id===runId && Array.isArray(m.agent_ids);
  if (own(value)) return {manifest:value, frozen:false};
  if (own(value?.frozen_run_manifest)) return {manifest:value.frozen_run_manifest, frozen:true};
  return null;
}
/** @brief 在随库提供的 manifest.json 中找出本库所属运行的运行清单；运行清单本身优先于导出清单中冻结的副本（导出逐字
 *  复制，内容相同）。读不出或解析失败的文件记英文错误日志，与其余不属于本库运行的清单一起计入忽略数。 */
async function loadRunManifest(candidates){
  let found = null, ignored = 0;
  for (const candidate of candidates){
    let own = null;
    try{ own = ownRunManifest(JSON.parse(await candidate.read())); }
    catch(error){ console.error('Unreadable manifest file:', candidate.path, error.message); }
    if (!own){ ignored++; continue; }
    if (!found || (found.frozen && !own.frozen)) found = {...own, path:candidate.path};
  }
  S.runManifest = found;
  S.ignoredManifests = ignored;
}
/** @brief 运行输入警告卡片（docs/dev/SPEC-dayrun-fidelity.md 1.3、九）：来源清单与警告；没有读到清单时说明怎样提供。 */
function renderInputWarnings(agent){
  const head = '<h3 style="margin-top:0">运行输入警告</h3>';
  const found = S.runManifest;
  if (!found){
    const ignored = S.ignoredManifests
      ? `随库提供的 ${S.ignoredManifests} 个 manifest.json 都不是本库所属运行的运行清单。` : '';
    return `<div class="card">${head}<div class="hint">未读取本库所属运行的运行清单：与 footprints.sqlite 一起拖入或选择` +
      `同一 run 目录的 <code>manifest.json</code>（也可拖入导出目录），即可列出运行输入警告。${ignored}</div></div>`;
  }
  return `<div class="card">${head}
    <div class="kv"><span class="k">来源</span><span class="v">${esc(found.path)}${found.frozen?' · frozen_run_manifest':''}</span></div>
    ${inputWarningBody(found.manifest, agent)}</div>`;
}
/** @brief 清单 input_warnings 的四种情形：没有这个键（清单早于运行输入警告）与 null（引擎直驱）都写明未计算，空列表写明
 *  没有警告；其余逐条列出警告码与说明，人物的警告按编号在前、场景级（agent_id 为 null）在后，按人物筛选时只列该人物与场景级。 */
function inputWarningBody(manifest, agent){
  const note = text => `<div class="empty">${text}</div>`;
  if (!('input_warnings' in manifest)) return note('未计算：运行清单没有 input_warnings 键（清单早于运行输入警告）');
  const list = manifest.input_warnings;
  if (list===null) return note('未计算：清单的 input_warnings 为 null（引擎直驱建立的运行）');
  if (!Array.isArray(list)){
    console.error('Run manifest input_warnings is neither a list nor null');
    return note('清单的 input_warnings 不是列表，无法列出');
  }
  if (!list.length) return note('无输入警告');
  const scenario = item => item?.agent_id==null;
  const rows = list.filter(item=>!agent || scenario(item) || String(item.agent_id)===agent)
    .sort((x,y)=>scenario(x)-scenario(y) || (x.agent_id??0)-(y.agent_id??0));
  const persons = list.filter(item=>!scenario(item)).length;
  const count = `<div class="kv"><span class="k">条数</span><span class="v">共 ${list.length} 条：人物 ${persons} 条、` +
    `场景级 ${list.length-persons} 条${agent?`；当前筛选 ${rows.length} 条`:''}</span></div>`;
  if (!rows.length) return count + note('所选人物没有输入警告');
  return count + `<table class="warning-table"><thead><tr><th>归属</th><th>警告码</th><th>说明</th></tr></thead><tbody>
    ${rows.map(item=>`<tr><td style="white-space:nowrap">${scenario(item)? '<span class="tl-agent badge-a0">场景级</span>'
        : `<span class="tl-agent ${agentCls(item.agent_id)}">${esc(agentName(item.agent_id))}</span>`}</td>
      <td style="white-space:nowrap;font-family:var(--mono);font-size:12px">${esc(item?.code)}</td>
      <td>${esc(item?.message)}</td></tr>`).join('')}
    </tbody></table>`;
}

/* ---------- 时间线 ---------- */
const TL = { chunk:150, rendered:0, filtered:[], types:new Set(), kw:'', tmin:0, tmax:0, lo:null, hi:null, step:600,
  lastDay:null, dayCounts:new Map(), observer:null };
/** @brief 时间滑块的两端：日期筛选选中的那一天，未筛选时为整个运行；两端一变，已拖动的范围随之回到两端。 */
function timelineBounds(){
  const range = dayRange();
  const lo = range? Math.max(S.t0, range[0]) : S.t0, hi = range? Math.min(S.t1, range[1]-1) : S.t1;
  if (TL.lo!==lo || TL.hi!==hi){ TL.lo = lo; TL.hi = hi; TL.tmin = lo; TL.tmax = hi; }
  TL.step = hi-lo > 2*86400? 600 : 60;
}
function renderTimeline(){
  const el = $('#tl-body');
  if (!TL.inited){
    TL.inited = true;
    TL.types = new Set(Object.keys(S.typeCounts));
  }
  timelineBounds();
  const counts = {};
  for (const e of S.events) if (e.t>=TL.lo && e.t<=TL.hi) counts[e.type] = (counts[e.type]||0)+1;
  el.innerHTML = `
  <div class="filter-bar">
    <label>类型
      <span class="chips" id="tl-chips">
        ${Object.entries(S.typeCounts).sort((a,b)=>b[1]-a[1]).map(([t])=>
          `<span class="chip${TL.types.has(t)?' on':''}" data-t="${esc(t)}" style="--c:${typeColor(t)}" title="${esc(t)}">${esc(typeLabel(t))} ${counts[t]||0}</span>`).join('')}
        <span class="chip" id="tl-all">全选</span><span class="chip" id="tl-none">全不选</span>
      </span>
    </label>
    <label>时间
      <span class="range-wrap">
        <input type="range" id="tl-r0" min="${TL.lo}" max="${TL.hi}" step="${TL.step}" value="${TL.tmin}">
        <span id="tl-r0v" style="width:76px;font-family:var(--mono);font-size:11px">${fmtHM(TL.tmin)}</span>
        ~ <input type="range" id="tl-r1" min="${TL.lo}" max="${TL.hi}" step="${TL.step}" value="${TL.tmax}">
        <span id="tl-r1v" style="width:76px;font-family:var(--mono);font-size:11px">${fmtHM(TL.tmax)}</span>
      </span>
    </label>
    <label>搜索 <input type="search" id="tl-kw" placeholder="摘要关键词或 #seq" value="${esc(TL.kw)}" style="width:150px"></label>
    <span style="flex:1"></span>
    <span id="tl-count" style="color:var(--fg-dim);font-size:12px"></span>
  </div>
  <div id="tl-list"></div>
  <div class="tl-sentinel" id="tl-sentinel">下拉加载更多 …</div>`;

  $('#tl-chips').addEventListener('click', ev=>{
    const c = ev.target.closest('.chip'); if(!c) return;
    if (c.id==='tl-all') TL.types = new Set(Object.keys(S.typeCounts));
    else if (c.id==='tl-none') TL.types.clear();
    else { const t=c.dataset.t; TL.types.has(t)? TL.types.delete(t) : TL.types.add(t); }
    $$('#tl-chips .chip[data-t]').forEach(x=>x.classList.toggle('on', TL.types.has(x.dataset.t)));
    refreshTimeline();
  });
  $('#tl-r0').oninput = ev=>{ TL.tmin=Math.min(+ev.target.value,TL.tmax-TL.step); ev.target.value=TL.tmin;
    $('#tl-r0v').textContent=fmtHM(TL.tmin); refreshTimeline(); };
  /* 滑块只取 lo 起每步一格的值，拖到最右也可能差不足一步到不了 hi：最后一格直接算作 hi，末尾的事件不被漏掉 */
  $('#tl-r1').oninput = ev=>{ const value = +ev.target.value;
    TL.tmax = value>=TL.hi-TL.step? TL.hi : Math.max(value,TL.tmin+TL.step); ev.target.value=TL.tmax;
    $('#tl-r1v').textContent=fmtHM(TL.tmax); refreshTimeline(); };
  let kwTimer=null;
  $('#tl-kw').oninput = ev=>{ clearTimeout(kwTimer); kwTimer=setTimeout(()=>{ TL.kw=ev.target.value.trim(); refreshTimeline(); },250); };

  if (TL.observer) TL.observer.disconnect();
  TL.observer = new IntersectionObserver(entries=>{
    if (entries[0].isIntersecting) renderMoreTimeline();
  }, {root:$('#main'), rootMargin:'400px'});
  TL.observer.observe($('#tl-sentinel'));
  refreshTimeline();
}
function refreshTimeline(){
  const agent = agentFilterVal();
  const kw = TL.kw.toLowerCase();
  TL.filtered = S.events.filter(e=>
    TL.types.has(e.type) &&
    (!agent || String(e.agent)===agent) &&
    e.t>=TL.tmin && e.t<=TL.tmax &&
    (!kw || e.sum.toLowerCase().includes(kw) || String(e.seq).includes(TL.kw))
  );
  TL.rendered = 0;
  TL.lastDay = null;
  TL.dayCounts = new Map();
  for (const e of TL.filtered){ const day = dayIndex(e.t); TL.dayCounts.set(day, (TL.dayCounts.get(day)||0)+1); }
  $('#tl-list').innerHTML = '';
  $('#tl-count').textContent = `${nf(TL.filtered.length)} / ${nf(S.events.length)} 条`;
  renderMoreTimeline();
}
/** @brief 时间线的当地日分隔行（吸顶）：日期、周几与当前筛选下这一天的事件数；行内只写时分秒，日期由分隔行给出。 */
function tlDayHeader(day){
  const head = document.createElement('div');
  head.className = 'tl-day';
  head.innerHTML = `${esc(dayLabel(day))}<span class="n">${nf(TL.dayCounts.get(day))} 条</span>`;
  return head;
}
function renderMoreTimeline(){
  if (TL.rendered >= TL.filtered.length){
    $('#tl-sentinel').textContent = TL.filtered.length? '—— 到底了 ——':'（无匹配事件）';
    return;
  }
  $('#tl-sentinel').textContent = '下拉加载更多 …';
  const frag = document.createDocumentFragment();
  const end = Math.min(TL.rendered+TL.chunk, TL.filtered.length);
  for (let i=TL.rendered;i<end;i++){
    const day = dayIndex(TL.filtered[i].t);
    if (day!==TL.lastDay){ frag.appendChild(tlDayHeader(day)); TL.lastDay = day; }
    frag.appendChild(tlRow(TL.filtered[i]));
  }
  TL.rendered = end;
  $('#tl-list').appendChild(frag);
}
function tlRow(e){
  const row = document.createElement('div');
  row.className='tl-row'; row.dataset.seq=e.seq;
  row.innerHTML = `
    <span class="tl-time" title="${esc(fmtT(e.t))}">${fmtClock(e.t)}</span>
    <span class="tl-agent ${agentCls(e.agent)}">${e.agent==null?'系统':esc(agentName(e.agent))}</span>
    <span class="tl-type" style="background:${typeColor(e.type)}33;color:${typeColor(e.type)}" title="${esc(e.type)}">${esc(typeLabel(e.type))}</span>
    <span class="tl-sum">${esc(e.sum)}</span>`;
  row.onclick = ()=>toggleDetail(row, e.seq);
  return row;
}
function toggleDetail(row, seq){
  let det = row.nextElementSibling;
  if (det && det.classList.contains('tl-detail')){
    det.classList.toggle('on');
    return;
  }
  det = document.createElement('div');
  det.className='tl-detail on';
  if (S.events.find(event => event.seq === seq)?.type === 'model_request') {
    const button = document.createElement('button');
    button.type = 'button'; button.textContent = '查看上下文';
    button.onclick = () => ContextView.select(seq);
    det.appendChild(button);
  }
  const pre = document.createElement('pre');
  pre.textContent = prettyBody(seq);
  det.appendChild(pre);
  row.after(det);
}

/* ---------- 活动表格（替代甘特图） ---------- */
const AT = { sortKey:'start', sortDir:1, page:0, pageSize:50, filtered:[] };
/** @brief 以活动自身标题或目的地名称展示活动对象。 */
function actTargetText(a){
  if (a.kind==='travel' && a.origin && a.path?.length){
    return `${locLabel(a.origin)} → ${locLabel(a.dest)} · 路径：${a.path.map(locLabel).join(' → ')}`;
  }
  if (a.tg) return targetLabel(a.tg, a.title);
  if (a.dest) return `→ ${locLabel(a.dest)}`;
  return '—';
}
/** @brief 把活动的已结算区间按当地日切开：返回 Map(日序号 -> [{start,end,from,to,act}])，start、end 是落在这一天里的
 *  一段，from、to 是整个区间；跨零点的区间在每一天各占一段。 */
function daySegments(activities){
  const days = new Map();
  for (const act of activities) for (const [from,to] of act.intervals){
    for (let day=dayIndex(from); day<=dayIndex(to-1); day++){
      if (!days.has(day)) days.set(day, []);
      days.get(day).push({start:Math.max(from,dayStart(day)), end:Math.min(to,dayStart(day+1)), from, to, act});
    }
  }
  return days;
}
/** @brief 同一天里时间重叠的条块上下并排：按开始时刻依次放进最先空出来的一排，在每段写上所在排 row，返回排数。 */
function packRows(segments){
  const ends = [];
  for (const segment of segments.sort((x,y)=>x.start-y.start || x.end-y.end)){
    let row = ends.findIndex(end=>end<=segment.start);
    if (row<0) row = ends.length;
    ends[row] = segment.end;
    segment.row = row;
  }
  return ends.length;
}
/** @brief 活动的完整说法：活动类型加对象（标题、目的地），没有对象的只写类型。 */
function actFullLabel(a){
  return `${actTypeLabel(a.kind,a.tg)} ${a.tg||a.dest? actTargetText(a):''}`.trim();
}
/** @brief 条块上的短名：活动对象（标题、目的地）优先，没有对象的活动写活动类型。 */
function actShortLabel(a){
  return a.tg||a.dest? actTargetText(a) : actTypeLabel(a.kind,a.tg);
}
/** @brief 一个当地日的泳道行：横轴 00:00–24:00，条块按所在排上下错开；悬停给出整段起止、时长与完整名称。 */
function renderDayLane(day, segments){
  const rows = Math.max(1, packRows(segments));
  const bars = segments.map(segment=>{
    const a = segment.act;
    const left = (segment.start-dayStart(day))/864, width = (segment.end-segment.start)/864;
    const tip = `${fmtHM(segment.from)}–${fmtHM(segment.to)}（${fmtDur(segment.to-segment.from)}） · ${actFullLabel(a)}`;
    return `<span class="act-lane-bar" style="left:${left}%;width:${width}%;top:${4+segment.row*17}px;` +
      `background:${kindColor(a.kind)}" title="${esc(tip)}"><span class="act-lane-text">${esc(actShortLabel(a))}</span></span>`;
  }).join('');
  return `<div class="act-lane${isWeekend(day)?' weekend':''}">
    <button type="button" class="act-lane-label" data-day="${day}" title="只看这一天（再点一次回到全部）">${esc(dayLabel(day))}</button>
    <div class="act-lane-track" style="height:${7+rows*17}px">${bars}</div></div>`;
}
/** @brief 按当地日绘制人物的活动泳道：每行一天、横轴固定 24 小时，条块只取已结算区间；日期筛选下只画选中的那一天。 */
function renderActivityLanes(activities){
  const range = dayRange();
  const axis = [0,3,6,9,12,15,18,21,24].map(hour=>
    `<span style="left:${hour/24*100}%">${String(hour).padStart(2,'0')}:00</span>`).join('');
  const agents = [...new Set(activities.map(a=>a.agent))];
  const groups = agents.map(agent=>{
    const days = daySegments(activities.filter(a=>a.agent===agent));
    const keys = [...days.keys()];
    const first = range? dayIndex(range[0]) : Math.min(...keys), last = range? first : Math.max(...keys);
    let lanes = '';
    for (let day=first; day<=last; day++) lanes += renderDayLane(day, days.get(day)||[]);
    return `<h3>${esc(agentName(agent))}</h3><div class="act-agent">
      <div class="act-lane-axis">${axis}</div>${lanes}</div>`;
  }).join('');
  const kinds = [...new Set(activities.map(a=>a.kind))];
  return `<div class="card act-lanes">
    <div class="hint">每行是一个当地日（00:00–24:00）。同一时间轴上的条块表示实际执行区间，同时进行的活动上下并排；空白表示尚无结算记录。
      悬停条块看起止与名称，点行首日期只看那一天。</div>
    <div class="legend">${kinds.map(k=>`<span><span class="sw" style="background:${kindColor(k)}"></span>${esc(actTypeLabel(k,null))}</span>`).join('')}</div>
    ${groups}</div>`;
}
/** @brief 地点会话（一段停留或一段路）只存于世界状态，按开始时刻列出其名称、种类与所含活动。 */
function renderSessions(agent){
  const acts = S.world?.activities||{};
  const rows = Object.values(S.world?.sessions||{})
    .filter(s=>SESSION_KIND_LABELS[s.kind] && (!agent || String(s.agent_id)===agent))
    .filter(s=>overlapsDay(s.started_at, s.ended_at??S.t1))
    .sort((x,y)=>x.started_at-y.started_at);
  if (!rows.length) return '';
  const members = s => (s.activity_ids||[]).map(id=>acts[id]?.name).filter(Boolean).join('、')
    || `${(s.activity_ids||[]).length} 项活动`;
  return `<h3>地点会话</h3><div class="card" style="padding:0">
    <table class="session-table">
      <thead><tr><th>开始</th><th>人物</th><th>会话</th><th>种类</th><th>结束</th><th>状态</th><th>活动</th></tr></thead>

/* ---------- 折线图（Canvas 手绘 + 悬停读数） ---------- */
/** @brief 横轴刻度 [{t, label}]，每个刻度画一条竖线：跨度不超过两天时按整点（零点写日期），更长时按当地日零点。
 *  标签按可用宽度隔开（隔 2 天，再长则隔 1、2、4 周并对齐周一），相邻标签不重叠；没轮到的日分界线标签为空，
 *  每天不足 6 像素时连线也不画。 */
function timeTicks(x0, x1, width){
  const off = S.tzOff, span = x1-x0, ticks = [], room = 46;
  if (span <= 2*86400){
    const step = [3600,7200,10800,21600].find(size=>span/size*room <= width) || 43200;
    for (let t=Math.ceil((x0+off)/step)*step-off; t<=x1; t+=step){
      const midnight = (t+off)%86400===0;
      ticks.push({t, label:(midnight? S.fmt.md : S.fmt.hm)(new Date(t*1000))});
    }
    return ticks;
  }
  const days = span/86400;
  const every = [1,2,7,14,28].find(count=>days/count*room <= width) || 56;
  const dense = width/days >= 6;
  for (let t=Math.ceil((x0+off)/86400)*86400-off; t<=x1; t+=86400){
    const labelled = (dayIndex(t)-4)%every===0;   /* 序号 4 是周一：隔周的标签都落在周一 */
    if (labelled || dense) ticks.push({t, label:labelled? S.fmt.md(new Date(t*1000)) : ''});
  }
  return ticks;
}
/** @brief 画折线图。opts：yfmt 纵轴读数格式；xdomain 固定横轴范围（日期筛选下为选中的那一天，域外的点只用来把线连到
 *  两端，画线时裁在绘图区内）；guide 悬停处的时刻，画一条竖直参考线。 */
function drawLineChart(canvas, series, opts){
  opts = opts||{};
  const dpr = devicePixelRatio||1;
  const W = canvas.clientWidth||600, H = canvas.clientHeight||120;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const padL=56, padR=10, padT=8, padB=16;
  const pts = series.flatMap(s=>s.points);
  if (!pts.length){ ctx.fillStyle='#5b636e'; ctx.font='11px system-ui'; ctx.fillText('无数据',W/2,H/2); return; }
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for (const [t,v] of pts){ if(v==null) continue; x0=Math.min(x0,t);x1=Math.max(x1,t);y0=Math.min(y0,v);y1=Math.max(y1,v); }
  if (opts.xdomain){ x0=opts.xdomain[0]; x1=opts.xdomain[1]; }
  if (y1===y0) y1=y0+1;
  const pad=(y1-y0)*.08; y0-=pad; y1+=pad;
  const X = t => padL+(t-x0)/((x1-x0)||1)*(W-padL-padR);
  const Y = v => padT+(1-(v-y0)/((y1-y0)||1))*(H-padT-padB);
  ctx.font='10px system-ui';
  ctx.strokeStyle='#232a36'; ctx.fillStyle='#5b636e'; ctx.textAlign='right';
  for (let i=0;i<=3;i++){
    const v = y0+(y1-y0)*i/3, y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(opts.yfmt? opts.yfmt(v): (+v.toFixed(2)), padL-6, y+3);
  }
  if (x1>x0){
    for (const tick of timeTicks(x0, x1, W-padL-padR)){
      const xx=X(tick.t); ctx.strokeStyle='#39424f';
      ctx.beginPath(); ctx.moveTo(xx,padT); ctx.lineTo(xx,H-padB); ctx.stroke();
      /* 贴边的标签向内对齐，不被画布边缘切掉 */
      ctx.textAlign = xx>W-padR-18? 'right' : (xx<padL+18? 'left' : 'center');
      ctx.fillStyle='#5b636e'; ctx.fillText(tick.label, xx, H-4);
    }
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(padL, 0, W-padL-padR, H-padB); ctx.clip();
  for (const s of series){
    ctx.strokeStyle=s.color; ctx.lineWidth=1.5; ctx.beginPath();
    let started=false;
    for (const [t,v] of s.points){ if(v==null) continue;
      if (started) ctx.lineTo(X(t),Y(v)); else { ctx.moveTo(X(t),Y(v)); started=true; } }
    ctx.stroke();
  }
  if (opts.guide!=null){
    ctx.strokeStyle='#8b949e'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(X(opts.guide),padT); ctx.lineTo(X(opts.guide),H-padB); ctx.stroke();
  }
  ctx.restore();
  canvas._chart = {series, x0,x1,y0,y1, X, opts:{...opts, guide:null}};
}
function attachHover(canvas, readoutEl){
  if (!readoutEl) return;
  canvas.onmousemove = ev=>{
    const c = canvas._chart; if (!c) return;
    const rect = canvas.getBoundingClientRect();
    const px = ev.clientX-rect.left;
    let best=null, bd=Infinity;
    for (const s of c.series) for (const [t,v] of s.points){
      if (t<c.x0 || t>c.x1) continue;
      const d = Math.abs(c.X(t)-px); if (d<bd){bd=d;best=t;}
    }
    if (best==null){ readoutEl.textContent=''; return; }
    const parts = [S.fmt.full(new Date(best*1000))];
    for (const s of c.series){
      let bb=null,bdd=Infinity;
      for (const [t,v] of s.points){ if(v==null) continue; const d=Math.abs(t-best); if(d<bdd){bdd=d;bb=v;} }
      parts.push(`${s.name}: ${bb==null?'—':(+bb.toFixed(3))}`);
    }
    readoutEl.textContent = parts.join('   |   ');
    drawLineChart(canvas, c.series, {...c.opts, guide:best});
  };
  canvas.onmouseleave = ()=>{
    readoutEl.textContent='';
    if (canvas._chart) drawLineChart(canvas, canvas._chart.series, canvas._chart.opts);
  };
}
/** @brief 日期筛选下一个人物的曲线取点：选中那一天里的观测，加上前后各一个相邻观测，让线连到当日两端。 */
function dayPoints(list){
  const range = dayRange();
  if (!range) return list;
  const first = list.findIndex(o=>o.t>=range[0]);
  if (first<0) return list.slice(-1);
  let last = first;
  while (last<list.length && list[last].t<range[1]) last++;
  return list.slice(Math.max(0,first-1), last+1);
}
function chartSeries(obs, key){
  const byAgent = new Map();
  for (const o of obs){ if(!byAgent.has(o.agent)) byAgent.set(o.agent,[]); byAgent.get(o.agent).push(o); }
  const palette = ['#58a6ff','#3fb950','#d29922','#f85149','#d2a8ff'];
  return [...byAgent.entries()].map(([a,list],i)=>({
    name:`${agentName(a)}`, color:palette[i%palette.length], points:dayPoints(list).map(o=>[o.t,o[key]])
  }));
}
/** @brief 曲线图的横轴范围：日期筛选选中的那一天，未筛选时由数据决定。 */
const chartDomain = () => dayRange() || undefined;

function renderEconomy(){
  const el = $('#eco-body');
  const agent = agentFilterVal();
  const obs = S.obs.filter(o=>!agent || String(o.agent)===agent);
  const series = chartSeries(obs,'bal');

  /* 流水：环境事件账户注入 + 订单 + 余额变动（全局 Agent 筛选只保留所选 agent 的行） */
  const flowsAll = [];
  for (const e of S.events){
    if (e.type==='environment_event'){
      const s = S.summaries.get(e.seq)||{};
      let rc = s.rc; if (typeof rc==='string'){ try{rc=JSON.parse(rc);}catch(_){rc=null;} }
      if (rc && typeof rc==='object')
        for (const [acct,amt] of Object.entries(rc))
          flowsAll.push({t:e.t, who:acct, delta:amt, after:null, note:ENVK_LABELS[s.ekind]||s.ekind||''});
    }
    if (e.type==='action_result'){
      const s = S.summaries.get(e.seq)||{};
      for (const o of s.orders||[])
        flowsAll.push({t:e.t, who:`agent:${e.agent}`, delta:-o.total_price_fen, after:null,
          note:`购买 ${targetLabel(o.food_id)}${s.msg?' · '+s.msg:''}`});
    }
  }
  const byAgent = new Map();
  for (const o of obs){ if(!byAgent.has(o.agent)) byAgent.set(o.agent,[]); byAgent.get(o.agent).push(o); }
  for (const [a,list] of byAgent){
    let prev=null;
    for (const o of list){
      if (prev!=null && o.bal!==prev.bal)
        flowsAll.push({t:o.t, who:`agent:${o.agent}`, delta:o.bal-prev.bal, after:o.bal, note:'余额变动'});
      prev=o;
    }
  }
  const flows = flowsAll.filter(f=>inDay(f.t) && (!agent || f.who===`agent:${agent}`));
  flows.sort((x,y)=>y.t-x.t);
  const shown = flows.slice(0,800);

  let accounts='';
  if (S.world && S.world.accounts){
    accounts = Object.entries(S.world.accounts)
      .filter(([k])=>!agent || k===`agent:${agent}`)
      .sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      `<tr><td>${esc(acctLabel(k))}</td><td class="num">¥ ${fmtFen(v)}</td></tr>`).join('');
  }
  el.innerHTML = `
  <div class="card">
    <div class="legend">${series.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}
      <span style="margin-left:auto;color:var(--fg-faint)">按观测事件采样 · 单位：分</span></div>
    <canvas id="eco-canvas"></canvas>
    <div class="chart-title" style="margin-top:4px"><span></span><span class="hover-readout" style="font-family:var(--mono);color:var(--fg-dim)"></span></div>
  </div>
  <div class="grid g2 eco-grid">
    <div class="card">
      <h3 style="margin-top:0">流水明细（新→旧${flows.length>800?'，前 800 / 共 '+flows.length+' 条':'，共 '+flows.length+' 条'}）</h3>
      <div style="max-height:420px;overflow:auto">
      <table><tr><th>时间</th><th>对象</th><th class="num">变动（分）</th><th class="num">余额（元）</th><th>备注</th></tr>
      ${shown.map(f=>`<tr><td style="white-space:nowrap;font-family:var(--mono);font-size:12px">${fmtT(f.t)}</td>
        <td style="font-size:12px">${esc(acctLabel(f.who))}</td>
        <td class="num" style="color:${f.delta>=0?'var(--ok)':'var(--err)'}">${f.delta>=0?'+':''}${nf(f.delta)}</td>
        <td class="num">${f.after!=null?fmtFen(f.after):'—'}</td>
        <td style="color:var(--fg-dim)">${esc(f.note)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">无</td></tr>'}
      </table></div>
    </div>

      <h3 style="margin-top:0">期末账户（world_state）</h3>
      <table>${accounts || '<tr><td class="empty">无 world_state</td></tr>'}</table>
    </div>
  </div>`;
  requestAnimationFrame(()=>{
    const cv = $('#eco-canvas');
    drawLineChart(cv, series, {yfmt:v=>nf(Math.round(v)), xdomain:chartDomain()});
    attachHover(cv, cv.closest('.card').querySelector('.hover-readout'));
  });
}

function renderMemory(){
  const el = $('#mem-body');
  const agent = agentFilterVal();
  const rows = q(`SELECT v.event_seq AS seq, json_extract(e.body,'$.data.episodes') AS episodes
    FROM ${EVENTS_OF_TYPE} ORDER BY v.event_seq DESC`, ['memory_updated']);
  const events = new Map(S.events.map(e=>[e.seq,e]));
  const entries = rows.flatMap(row=>{
    const event = events.get(row.seq);
    if (!event || (agent && String(event.agent)!==agent) || !inDay(event.t)) return [];
    let episodes;
    try{ episodes = JSON.parse(row.episodes||'[]'); }
    catch(error){ console.error('Invalid memory episode JSON:', error); throw error; }
    if (!Array.isArray(episodes)){
      console.error('Memory episodes must be an array');
      throw new Error('Memory episodes must be an array');
    }
    return episodes.map(episode=>({event, episode}));
  });
  const summaries = Object.entries(S.memFiles).filter(([aid])=>!agent || aid===agent)
    .filter(([,memory])=>memory.memoryMd).map(([aid,memory])=>
      `<div class="mem-file"><h4>${esc(agentName(aid))} · 主观总结</h4>
        <pre>${esc(memory.memoryMd)}</pre></div>`).join('');
  let lastDay = null;
  /** @brief 写入日变化处插入当地日分隔行（吸顶），条目本身只写时分秒。 */
  const dayHead = t => {
    const day = dayIndex(t);
    if (day===lastDay) return '';
    lastDay = day;
    return `<div class="tl-day">${esc(dayLabel(day))}</div>`;
  };
  el.innerHTML = `${summaries}
    <div class="card"><h3 style="margin-top:0">人物记忆正文（${entries.length} 条）</h3>
    <div class="hint">按写入时间从新到旧展示。人物记忆是主观自述，不能直接当作已核验事实。</div>
    ${entries.map(({event,episode})=>`${dayHead(event.t)}<div class="memory-entry">
      <div class="meta" title="${esc(fmtT(event.t))}">${esc(fmtClock(event.t))} · ${esc(agentName(event.agent))} ·
        ${esc(MEMORY_TYPE_LABELS[episode.type]||episode.type||'记忆')}</div>
      <div class="text">${esc(episode.text||'')}</div></div>`).join('') ||
      '<div class="empty">没有记忆正文</div>'}</div>`;
}
