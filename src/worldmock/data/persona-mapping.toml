# 画像编译 v2 映射规则表（worldmock.profile.mapper 的唯一数值来源，规格见 docs/dev/SPEC-life-realism.md「画像编译」）。
# v1 的九参数动机映射（weights/tau/beta_present_bias/loss_aversion/comfort/aspiration/
# emotion_sensitivity/attention_prior）已整体删除，不保留别名。
# 大五只进世界层动力学；大五分数与任何权重不得进入提示。
# 每个 section 标注 basis：anchored=心理学常识/量表惯例锚定，assumption=工程取值假设。

version = 2

[big_five_center]
# 1-7 刻度中心 4、半跨 3：7→+1.0、4→0.0、1→-1.0。
center = 4.0
span = 3.0

# ---------------------------------------------------------------------------
# world_dynamics：大五 → 世界层动力学参数 = intercept + slope×normalized，
# 钳制到 [min, max] 后吸附 step 格点（docs/dev/SPEC-life-realism.md「画像编译」的五条映射）。
# ---------------------------------------------------------------------------

# 神经质 → 情绪脉冲幅度 [0.2, 1.0] 步进 0.05（基础脉冲表的整体缩放系数）。
# basis=anchored：神经质即负性情绪易感性，放大事件脉冲（OCC 评价理论）；
# 幅度为 experiment_assumption。
[world_dynamics.mood_pulse_amplitude]
intercept = 0.6
slope_neuroticism = 0.4
min = 0.2
max = 1.0
step = 0.05

# 神经质 → 情绪半衰期（分钟）[20, 90] 步进 5：高神经质情绪回落更快但幅度更大。
# basis=anchored：高神经质的情绪动态性（affective instability）表现为快起快落；
# 幅度为 experiment_assumption。
[world_dynamics.mood_halflife_minutes]
intercept = 55.0
slope_neuroticism = -25.0
min = 20.0
max = 90.0
step = 5.0

# 外向性 → 社交需要增长率（每小时）[0.02, 0.10] 步进 0.01。
# basis=anchored：外向性→社交寻求；幅度为 experiment_assumption。
[world_dynamics.social_need_growth_per_hour]
intercept = 0.06
slope_extraversion = 0.04
min = 0.02
max = 0.10
step = 0.01

# 外向性 → 交谈缓解量（每小时）[0.3, 0.7] 步进 0.05。
# basis=anchored：外向者从交谈获得更多社交满足；幅度为 experiment_assumption。
[world_dynamics.conversation_relief_per_hour]
intercept = 0.5
slope_extraversion = 0.2
min = 0.3
max = 0.7
step = 0.05

# 开放性 → 内部评分器多样性权重 [0.0, 1.0] 步进 0.05：越高越偏向探索非惯常选项。
# basis=anchored：开放性→求新求异（novelty seeking）；幅度为 experiment_assumption。
[world_dynamics.diversity_weight]
intercept = 0.5
slope_openness = 0.5
min = 0.0
max = 1.0
step = 0.05

# 宜人性 → 接受邀约倾向 [0.0, 1.0] 步进 0.05。
# basis=anchored：宜人性→合作与顺应；幅度为 experiment_assumption。
[world_dynamics.invitation_acceptance]
intercept = 0.5
slope_agreeableness = 0.5
min = 0.0
max = 1.0
step = 0.05

# 宜人性 → 回复消息倾向 [0.0, 1.0] 步进 0.05。
# basis=anchored：宜人性→体贴回应；幅度为 experiment_assumption。
[world_dynamics.reply_tendency]
intercept = 0.5
slope_agreeableness = 0.5
min = 0.0
max = 1.0
step = 0.05

# 尽责性 → 内部评分器现时偏好 [0.0, 1.0] 步进 0.05：高尽责更重延迟回报（斜率负）。
# basis=anchored：尽责性→延迟满足/自我控制；幅度为 experiment_assumption。
[world_dynamics.present_preference]
intercept = 0.7
slope_conscientiousness = -0.4
min = 0.0
max = 1.0
step = 0.05

# ---------------------------------------------------------------------------
# defaults：background_story 未提及时的确定性缺省（docs/dev/SPEC-life-realism.md「画像编译」）。
# sleep_need_hours 默认 7.5（人群众数量级，experiment_assumption）；
# chronotype_midsleep 默认 04:00（Roenneberg MCTQ 典型自由日睡眠中点，
# experiment_assumption）；时间锚点为都市白领典型窗口（experiment_assumption）。
# ---------------------------------------------------------------------------
[defaults]
sleep_need_hours = 7.5
chronotype_midsleep = "04:00"

[defaults.time_anchors]
wake = "07:00-07:30"
leave_home = "08:00-08:30"
lunch = "12:00-13:00"
dinner = "18:30-19:30"
bedtime = "23:00-24:00"
