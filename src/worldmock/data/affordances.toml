# 固定可供性只由引擎包提供，不在环境目录发布副本。
version = 2

[kinds.wait]
met_key = "wait"
energy_floor_exempt = true
sleep_channel = "awake"
relief = { channel = "none" }
resource_claims = ["wait"]
feedback_boundary = true
action = "wait"
target_discovery = "none"

[kinds.sleep]
met_key = "sleep"
energy_floor_exempt = true
sleep_channel = "recovery"
relief = { channel = "none" }
resource_claims = ["wait", "travel", "talk", "use_app", "entertainment", "work_study", "exercise", "daily_care"]
feedback_boundary = false
action = "sleep"
target_discovery = "none"

[kinds.travel]
met_key = "travel:{mode}"
met_key_modes = ["driving", "walking"]
energy_floor_exempt = false
sleep_channel = "awake"
relief = { channel = "none" }
feedback_boundary = true
action = "travel_to"
target_discovery = "none"

[kinds.travel.resource_claims]
base = ["travel"]
conditional = [
    { when = "mode:driving", add = ["wait", "entertainment", "work_study", "exercise", "daily_care", "use_app"] },
]

[kinds.action]
# action 的代谢由固定类别表结算，登记表不另列查表键。
energy_floor_exempt = false
sleep_channel = "awake"
relief = { channel = "content_rate" }
feedback_boundary = true
action = "do"
target_discovery = { source = "catalog_field", field = "actions", id_key = "action_id" }

[kinds.action.resource_claims]
base = []
conditional = [
    { when = "category:entertainment", add = ["entertainment"] },
    { when = "category:work_study", add = ["work_study"] },
    { when = "category:social", add = ["talk"] },
    { when = "category:exercise", add = ["exercise"] },
    { when = "category:daily_care", add = ["daily_care"] },
    { when = "manner:phone_continuous", add = ["use_app"] },
]
