[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmock"
version = "0.2.0"
description = "Auditable life simulation and digital footprint production"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.12.5",
  "litellm==1.89.2",
  "networkx==3.6.1",
  "jsonschema==4.26.0",
  "requests==2.32.5",
  "tzdata==2026.4",
]

[dependency-groups]
dev = [
    "coverage==7.15.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "tomlkit==0.15.1",
]

build = [
    "setuptools==84.0.0",
]

[project.scripts]
worldmock = "worldmock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "engine: tests with engine factory or direct LifeEngine imports",
    "mutation: isolated source mutation review",
    "day_run: complete persona-day execution",
    "external: tests requiring Node.js",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/worldmock", "tools/analysis"]
omit = [
    "*/tests/*",
    "*/scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
# 显式替换默认排除表：保留 pragma 与 TYPE_CHECKING，去掉对纯 `...` stub 行的
# 豁免，使未调用的占位实现出现在 missing_lines，被接口覆盖率门禁捕获。
exclude_lines = [
    "#\\s*(pragma|PRAGMA)[:\\s]?\\s*(no|NO)\\s*(cover|COVER)",
    "if (typing\\.)?TYPE_CHECKING:",
]
