[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmock"
version = "0.2.0"
description = "Auditable AS2 life simulation and digital footprint production"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentsociety2==2.8.7",
  "pydantic==2.12.5",
  "mcp==1.26.0",
  "litellm==1.89.2",
  "ray==2.55.1",
  "mem0ai==2.0.7",
  "datasets==5.0.1",
  "textworld==1.7.0",
  "rule-engine==5.0.2",
  "krippendorff==0.8.2",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "matplotlib==3.11.1",
  "networkx==3.6.1",
  "jsonschema==4.26.0",
  "requests==2.32.5",
  "python-dotenv==1.2.1",
  "jsonpointer==3.0.0",
]

[dependency-groups]
dev = [
    "coverage==7.15.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
worldmock = "worldmock.cli:main"

[tool.uv.sources]
agentsociety2 = { path = "vendor/agentsociety2/packages/agentsociety2", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
# 注意：coverage 枚举未执行文件时会剪枝无 __init__.py 的子目录，custom/agents
# 与 custom/envs 均非包，必须显式列为 source 叶子目录才能计入测量。
source = ["src/worldmock", "custom/agents", "custom/envs"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/vendor/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
# 显式替换默认排除表：保留 pragma 与 TYPE_CHECKING，去掉对纯 `...` stub 行的
# 豁免，使未调用的占位实现出现在 missing_lines，被接口覆盖率门禁捕获。
exclude_lines = [
    "#\\s*(pragma|PRAGMA)[:\\s]?\\s*(no|NO)\\s*(cover|COVER)",
    "if (typing\\.)?TYPE_CHECKING:",
]
