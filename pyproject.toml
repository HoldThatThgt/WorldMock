[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmock"
version = "0.2.0"
description = "Auditable AS2 life simulation and digital footprint production"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentsociety2==2.8.7",
  "pydantic==2.12.5",
  "mcp==1.26.0",
  "litellm==1.89.2",
  "ray==2.55.1",
  "mem0ai==2.0.7",
  "datasets==5.0.1",
  "textworld==1.7.0",
  "rule-engine==5.0.2",
  "krippendorff==0.8.2",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "matplotlib==3.11.1",
  "networkx==3.6.1",
  "jsonschema==4.26.0",
  "requests==2.32.5",
  "python-dotenv==1.2.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
worldmock = "worldmock.cli:main"

[tool.uv.sources]
agentsociety2 = { path = "vendor/agentsociety2/packages/agentsociety2", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
