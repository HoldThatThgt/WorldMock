# Open Food Facts 数据集家族 → 能量 source 边的翻译规则（映射规则范例）。
# 本文件是对既有白名单冻结结果的追认描述：corpora/open-food-facts/products.json
# （八条码白名单，corpus manifest entry open-food-facts:products.json）已按本规则
# 从 corpora/open-food-facts/china-100.json 冻结取值；本文件描述该冻结所依据的
# 翻译规则，不重新触发导入。设计依据：docs/design/03-resource-engine.md「来源分类」。

[dataset]
family = "open-food-facts"
raw_artifact = "corpora/open-food-facts/china-100.json"
frozen_artifact = "corpora/open-food-facts/products.json"
license = "ODbL-1.0"

[identity]
# 字段映射：OFF 原始字段 → 标准对象模型字段
barcode = "code"                    # → object_id = "food-" + barcode
name = "product_name"               # → name
serving_unit = "serving_size"       # → serving.unit，字符串原样（如 "250ml"、"2 tablespoons (30 g)"）

[energy_edge]
# 规则：凡有 kcal 字段的食品 → consume 能量 source 边（「来源分类」）。
on = "consume"
type = "source"
resource_id = "energy_kcal"         # 引用 catalog/resources.jsonl
unit = "kcal"
primary = "nutriments.energy-kcal_serving"   # 份量级 kcal，导入器直采（本批次 8/8 走此路径）
# 份量换算（回退条款，primary 缺失时使用；本冻结批次未触发）：
#   amount = nutriments.energy-kcal_100g * serving_quantity / 100
#   serving_quantity 为克/毫升数值；其缺失时不回退，落入下方缺省条款。
fallback = "nutriments.energy-kcal_100g * serving_quantity / 100"

[energy_edge.default]
# 缺省条款：primary 与回退输入任一缺失（字段缺失，非值为 0）→ 不生成能量边。
# 值为 0 是事实（如 zero cocacola energy-kcal_serving = 0），生成 amount = 0 的边。
missing_kcal_field = "no-edge"

[provenance]
# 生成边的数值溯源（「来源分类」）：kcal 值 = fact，条目引用 dataset + entry id。
energy_amount = { type = "fact", source = "openfoodfacts:product/<barcode>" }
