# 出行计费公式声明（travel-service 对象引用此声明，formula_ref = "travel-fare"）。
# v1 沿用现值：walking=0、driving=max(500, ceil(m*0.2))，m = 路线 distance_meters（米）。
# 该公式由场景组装器逐条核对选定地图全部可达路线的 fare_fen（当前为 220 条）。
# 设计依据：docs/design/02-exchange-engine.md「交换对象与资源变化声明」「交换规则的加载与准入」（计费公式引用准入）。

[formula.walking]
amount_fen = 0

[formula.driving]
amount_fen = "max(500, ceil(m * 0.2))"

[params]
m = "route.distance_meters"
mode = "route.mode"

[provenance]
# 公式数值溯源（「来源分类」）：v1 沿用场景现值，属 scenario 型。
fare = { type = "scenario", source = "legacy-scenario-routes" }
