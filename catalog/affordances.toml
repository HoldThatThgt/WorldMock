# 可供性注册表（affordance registry）——行为闭集的单一声明源。
#
# 设计文档：docs/design/02-exchange-engine.md（「可供性与活动声明」「交换规则的加载与准入」）。
# 两级结构：kinds（引擎活动类型，结算与受理的最小单元）× families（动机家族，习惯归并键
# + 候选生成器 + 注意力）。一个家族可跨多个 kind（entertainment = watch + play_game）；
# 一个 kind 可以不属于任何动机候选家族（read_mail：unclassified 显式声明）。
#
# 本文件是人写冻结文件：条目值逐字段对齐引擎现行常量（M0 影子迁移，零行为变化）；
# 修改即 catalog_version 级变更，运行期零 IO、零变更。

version = 1

# ---------- 活动类型层 ----------
# 字段语义（规范「可供性与活动声明」）：
#   met_key             MET 查表键；参数化键写模板：travel 用 "{mode}"（封闭展开域
#                       见 met_key_modes），lifestyle 用 "{item_id}"（开放命名空间前缀）。
#   energy_floor_exempt 能量投影可穿透下界的活动（派生 body.ENERGY_RECOVERY_ACTIVITY_KINDS）。
#   sleep_channel       recovery = 清债 | awake = 累积（body 结算分支）。
#   relief.channel      娱乐缓解通道四选一：none | intrinsic（wait 边等边刷，目录费率直读）|
#                       preference_rate（play_game：偏好 x 目录费率）|
#                       content_rate（watch：条目费率 x 偏好 / 接触次数）。
#   resource_claims     资源锁声明（position 恒占，不在表中重复声明）；travel 用
#                       conditional 子句表达 driving 条件锁。
#   feedback_boundary   到期反馈边界资格（派生 activities.FEEDBACK_ACTIVITY_KINDS 与
#                       agent 侧 continue_activity 资格闭集）。
#   game_boundary       play_game 专用 game_feedback 边界（真值时 feedback_boundary 必须为假；
#                       其游戏交互走 game_action，不经 continue_activity——故 continue 资格
#                       闭集不含 play_game，与现行 agent 行为一致）。
#   energy_projection   能量可行性投影覆盖的活动（派生 agent 侧 _ENERGY_LIMIT_KINDS）。
#   unclassified        显式声明：该 kind 的动作刻意不归入任何习惯家族（防拼写静默漏网）。
#   tool.surface        basic | targeted | travel | commerce | game | none（L4 工具面投影）；
#                       targeted/game 面的 activity_type 恒等于 kind 名（play_game 的游戏工具
#                       语法也经 start_targeted_activity 提交，故 targeted 枚举序含 play_game）。
#   target_discovery    观察目录直读 catalog_field（field/id_key）| 下钻结果 browse_result | none。

[kinds.wait]
met_key = "wait"
energy_floor_exempt = true
sleep_channel = "awake"
relief = { channel = "intrinsic" }
resource_claims = []
feedback_boundary = true
energy_projection = false
tool = { surface = "basic", activity_type = "wait" }
target_discovery = "none"

[kinds.sleep]
met_key = "sleep"
energy_floor_exempt = true
sleep_channel = "recovery"
relief = { channel = "none" }
resource_claims = []
feedback_boundary = false
energy_projection = false
tool = { surface = "basic", activity_type = "sleep" }
target_discovery = "none"

[kinds.work]
met_key = "work"
energy_floor_exempt = false
sleep_channel = "awake"
relief = { channel = "none" }
resource_claims = ["attention", "device", "hands"]
feedback_boundary = true
energy_projection = true
tool = { surface = "targeted", activity_type = "work" }
target_discovery = { source = "catalog_field", field = "tasks", id_key = "task_id" }

[kinds.watch]
met_key = "watch"
energy_floor_exempt = false
sleep_channel = "awake"
relief = { channel = "content_rate" }
resource_claims = ["attention", "device"]
feedback_boundary = true
energy_projection = true
tool = { surface = "targeted", activity_type = "watch" }
target_discovery = "browse_result"

[kinds.play_game]
met_key = "play_game"
energy_floor_exempt = false
sleep_channel = "awake"
relief = { channel = "preference_rate" }
resource_claims = ["attention", "device", "hands"]
feedback_boundary = false
game_boundary = true
energy_projection = true
tool = { surface = "game", activity_type = "play_game" }
target_discovery = { source = "catalog_field", field = "game_catalog", id_key = "game_id" }

[kinds.travel]
met_key = "travel:{mode}"
# "{mode}" 模板的封闭展开域（= 冻结路线的 TravelMode 闭集）：MET 表必须恰好
# 覆盖这些键（travel:driving / travel:walking），多键少键都在组装期拒绝。
met_key_modes = ["driving", "walking"]
energy_floor_exempt = false
sleep_channel = "awake"
relief = { channel = "none" }
resource_claims = { base = [], conditional = [{ when = "mode:driving", add = ["attention", "hands", "vehicle"] }] }
feedback_boundary = true
energy_projection = false
tool = { surface = "travel" }
target_discovery = "none"

[kinds.read_mail]
met_key = "read_mail"
energy_floor_exempt = false
sleep_channel = "awake"
relief = { channel = "none" }
resource_claims = ["attention", "device"]
feedback_boundary = true
energy_projection = true
# 现状显式化：read_mail 不参与习惯份额（classify_action_event 返回 None）。
unclassified = true
tool = { surface = "targeted", activity_type = "read_mail" }
target_discovery = { source = "catalog_field", field = "messages", id_key = "message_id" }

[kinds.browse]
met_key = "browse"
energy_floor_exempt = false
sleep_channel = "awake"
relief = { channel = "none" }
resource_claims = ["attention", "device"]
feedback_boundary = true
energy_projection = true
tool = { surface = "targeted", activity_type = "browse" }
target_discovery = { source = "catalog_field", field = "browse_targets" }

[kinds.consume]
met_key = "consume"
energy_floor_exempt = true
sleep_channel = "awake"
relief = { channel = "none" }
resource_claims = ["hands"]
feedback_boundary = true
energy_projection = false
tool = { surface = "commerce", activity_type = "consume" }
target_discovery = "none"

[kinds.lifestyle]
met_key = "lifestyle:{item_id}"
energy_floor_exempt = false
sleep_channel = "awake"
# docs/dev/SPEC-life-realism.md「动机层」：生活活动具备 relief 通道——缓解量按条目 effects 声明
# （lifestyle/items.json 的 effects.entertainment/social/health，activities.
# py 结算侧折算）。注册表通道保持 none：本表的通道四值语义是"目录活动费率
# 表"（semantics 对 resources.jsonl entertainment_relief_per_hour 的封闭键
# 映射），条目级 effects 不在活动费率表内；通道改走 preference_rate 需先在
# resources.jsonl 增加 lifestyle 费率键（目录数据属 A10 波次），届时 effects
# 分支让位注册表通道（activities._entertainment_relief 的分支序）。
relief = { channel = "none" }
resource_claims = []
feedback_boundary = true
energy_projection = false
tool = { surface = "basic", type_pattern = "lifestyle:{item_id}" }
target_discovery = "browse_result"
# 183 条、9 品类；与 MET 生活方式键一一对应（content.py 的 fail-closed 身份核对）。
target_corpus = "lifestyle/items.json"

# ---------- 动机家族层 ----------
# 字段语义（规范「可供性与活动声明」）：
#   kinds             家族聚合的活动类型（引用完整性：必须都已声明）。
#   attention         none = 不按内容品类采样；content_kind = 按品类键采样
#                     （per_kind 为家族内每品类采样上限，pool_cap 为全局
#                     MAX_CANDIDATES=26 内的家族配额：生存位 8 + lifestyle 4 +
#                     娱乐 14）。
#   habit_members     习惯归并路由（classify_action_event 的查表化）：匹配优先级
#                     精确 > 前缀（"lifestyle:*"）> 通配（"*"）。activity_type 省略
#                     等价 "*"（无 activity_type 空间的工具恒匹配）。
#   candidate         候选生成器原型名 + 参数（规范「可供性与活动声明」八原型；原型函数保持 Python，
#                     在 life/motivation.py 登记进 PROTOTYPE_GENERATORS）。
#   comfort           情绪分量 comfort_type（该家族候选自带舒适属性）。
#   enumeration_rank  候选池枚举序（升序遍历；省略 = 不参与枚举）。现行序：
#                     eat(10) > sleep(20) > continue(30) > work(40，含去工作地点的
#                     出行腿) > travel(50，回家腿) > browse(60) > lifestyle(60，
#                     同秩按名声明的字母序后于 browse) > entertainment(70，池尾)。
#   unclassified      家族显式声明：本身不收习惯事件。

[families.eat]
kinds = ["consume"]
attention = { kind = "none" }
habit_members = [
  { tool = "purchase" },
  { tool = "consume" },
]
candidate = { generator = "cheapest_feasible_meal" }
enumeration_rank = 10

[families.sleep]
kinds = ["sleep"]
attention = { kind = "none" }
habit_members = [
  { tool = "start_basic_activity", activity_type = "sleep" },
]
candidate = { generator = "clear_backlog", resource = "sleep_debt_hours", cap_seconds = 28800, fallback_seconds = 3600, min_session_seconds = 60 }
comfort = true
enumeration_rank = 20

[families.continue]
# "继续当前活动"跨全部活动类型；习惯路由覆盖 basic 工具的非 sleep 归并
# （wait 精确、其余通配——现行"非 sleep 一律归 continue"的显式化；lifestyle:*
# 前缀已迁往 lifestyle 家族：激活后生活活动事件归并进自己的习惯份额）。
kinds = ["wait", "sleep", "work", "watch", "play_game", "travel", "read_mail",
         "browse", "consume", "lifestyle"]
attention = { kind = "none" }
habit_members = [
  { tool = "continue_activity" },
  { tool = "start_basic_activity", activity_type = "wait" },
  { tool = "start_basic_activity", activity_type = "*" },
]
candidate = { generator = "continue_current" }
enumeration_rank = 30

[families.work]
kinds = ["work"]
attention = { kind = "none" }
habit_members = [
  { tool = "start_targeted_activity", activity_type = "work" },
  { tool = "submit_work" },
]
# task_slot 原型内含"去任务地点的出行腿"（不在任务地点时先给出行候选）。
candidate = { generator = "task_slot", max_tasks = 2 }
enumeration_rank = 40

[families.travel]
kinds = ["travel"]
attention = { kind = "none" }
habit_members = [
  { tool = "start_travel" },
]
candidate = { generator = "cheapest_route", destination = "home" }
enumeration_rank = 50

[families.browse]
kinds = ["browse"]
attention = { kind = "none" }
habit_members = [
  { tool = "start_targeted_activity", activity_type = "browse" },
  { tool = "discover_places" },
]
candidate = { generator = "catalog_visibility", probe_duration_seconds = 600 }
enumeration_rank = 60

[families.entertainment]
kinds = ["watch", "play_game"]
attention = { kind = "content_kind", sampling = "per_kind_top_n", per_kind = 2, pool_cap = 14 }
habit_members = [
  { tool = "start_targeted_activity", activity_type = "watch" },
  { tool = "start_targeted_activity", activity_type = "play_game" },
]
candidate = { generator = "content_menu", min_session_seconds = 600, cap_seconds = 14400, slot_policy = "two_segments" }
comfort = true
enumeration_rank = 70

# 内容品类子表：画像注意力键 + 标题来源（派生 content.TITLE_SOURCES）。
# attention_required = false 是显式声明的不参与采样（现行静默采零的显式化）：
# subtitle_experience 只经语料单例存在；game_session 走 game_catalog 独立面。
[families.entertainment.content_kinds.feature_film]
attention_required = true
title_source = { corpus_path = "movies/items.json", id_key = "item_id" }
[families.entertainment.content_kinds.drama_series]
attention_required = true
title_source = { corpus_path = "drama/items.json", id_key = "item_id" }
[families.entertainment.content_kinds.webnovel_excerpt]
attention_required = true
title_source = { corpus_path = "novels/items.json", id_key = "item_id" }
[families.entertainment.content_kinds.subtitle_experience]
attention_required = false
title_source = { corpus_path = "sintel/media-identity.json" }
[families.entertainment.content_kinds.news_feed]
attention_required = true
title_source = "self_label"
[families.entertainment.content_kinds.joke_feed]
attention_required = true
title_source = "self_label"
[families.entertainment.content_kinds.game_session]
attention_required = false
title_source = "self_label"

[families.lifestyle]
# M4 激活：从纯声明面迁入动机参与——content_menu 原型复用（开放命名空间分支：
# 候选目录来自 lifestyle 语料 + 场景 MET 身份核对 + 人物启用集过滤），每生活
# 品类采 top-1、全局配额 4（183 条涌入不挤掉生存位；枚举序在 browse 之后、
# 娱乐之前）。缓解：条目 effects 经 activities.lifestyle_relief_rates 折算
# （docs/dev/SPEC-life-realism.md「动机层」），候选侧预演同式——见 kinds.lifestyle 的 relief 注释。
kinds = ["lifestyle"]
attention = { kind = "content_kind", sampling = "per_kind_top_n", per_kind = 1, pool_cap = 4 }
# 习惯归并：lifestyle:* 前缀自 continue 家族迁入（前缀路由按声明序命中，
# continue 的通配兜底不再吸收生活活动事件）。
habit_members = [
  { tool = "start_basic_activity", activity_type = "lifestyle:*" },
]
candidate = { generator = "content_menu", min_session_seconds = 300, cap_seconds = 7200 }
enumeration_rank = 60

# lifestyle 的 9 个内容品类：画像注意力键（attention_required=true，键集
# 5→14，画像编译器与场景准入按新键集出题/核对）+ 标题来源（items.json 的
# 条目名是 name_zh 而非 title，标题注入按合同缺省不写——部分元数据合法）。
[families.lifestyle.content_kinds.sport]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
[families.lifestyle.content_kinds.hobby]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
[families.lifestyle.content_kinds.outdoor]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
[families.lifestyle.content_kinds.wellness]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
[families.lifestyle.content_kinds.household]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
[families.lifestyle.content_kinds.learning]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
[families.lifestyle.content_kinds.pet]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
[families.lifestyle.content_kinds.social]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
[families.lifestyle.content_kinds.volunteer]
attention_required = true
title_source = { corpus_path = "lifestyle/items.json", id_key = "activity_id" }
